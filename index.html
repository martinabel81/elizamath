<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Niffler's Hoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one burrow column (max 1000px); screens swap in place; play = Niffler beside a big question card. Single deliberate dark "underground" look. */
:root{
  --soil:#1b1423; --soil-2:#241b2f; --tunnel:#2e2340; --tunnel-2:#3b2e50; --root:#5a4874;
  --gold:#f7c74b; --gold-deep:#d9951b; --ink:#f8f1e4; --ink-dim:#c6b9d0;
  --good:#66d9a3; --oops:#ff9481; --gem1:#7fd6ff; --gem2:#ff94c9;
  --cube-top:#ffd56b; --cube-l:#e0a43a; --cube-r:#b97b22;
  --display:'Lilita One','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--soil);color:var(--ink);font-family:var(--body);font-weight:700;font-size:18px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -10%, rgba(247,199,75,.10), transparent 60%),
  radial-gradient(3px 3px at 12% 30%, rgba(255,255,255,.07) 50%, transparent 51%),
  radial-gradient(2px 2px at 78% 62%, rgba(255,255,255,.06) 50%, transparent 51%),
  radial-gradient(3px 3px at 40% 85%, rgba(255,255,255,.05) 50%, transparent 51%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
sup{font-size:.6em;line-height:0;position:relative;top:-.15em;vertical-align:super}
.app{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05}
h2{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h3{font-size:1.35rem}
p{margin:0}
.dim{color:var(--ink-dim)}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--display);font-size:1.5rem;color:var(--gold);padding:6px 0}
.bar nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.navbtn{padding:10px 16px;border-radius:999px;background:var(--tunnel);border:2px solid var(--root);min-height:48px}
.navbtn[aria-current="true"]{background:var(--tunnel-2);border-color:var(--gold)}
.purse{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--tunnel-2);border:2px solid var(--gold-deep);font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;min-height:48px}
.coin-ico{width:24px;height:24px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);flex:none}
.purse.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:18px;background:var(--tunnel-2);border:2px solid var(--root);font-weight:900;font-size:1.05rem}
.btn:active{transform:translateY(2px)}
.btn.gold{background:var(--gold);color:#2b1d07;border-color:var(--gold-deep);box-shadow:0 4px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.deep{background:#5b3fa0;border-color:#8a6fe0;box-shadow:0 4px 0 #3a2870}
.btn[disabled]{opacity:.45;cursor:default}

/* Niffler */
.niff{position:relative;width:100%;max-width:240px;aspect-ratio:200/230;cursor:pointer;user-select:none}
.niff svg{width:100%;height:100%;display:block;overflow:visible}
.niff.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.niff.tilt{animation:tilt .7s}
.niff.wiggle{animation:wiggle .6s}
.niff.swipe{animation:swipe 1.4s ease-in-out}
@keyframes hop{30%{transform:translateY(-22%) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes tilt{30%{transform:rotate(-9deg)}70%{transform:rotate(6deg)}}
@keyframes wiggle{20%{transform:rotate(6deg)}40%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}80%{transform:rotate(-3deg)}}
@keyframes swipe{0%{transform:none}35%{transform:translateX(160%) rotate(12deg);opacity:0}55%{transform:translateX(-160%);opacity:0}100%{transform:none;opacity:1}}
.bubble{position:relative;background:var(--ink);color:#2a1d36;border-radius:20px;padding:12px 16px;font-weight:800;font-size:1rem;max-width:300px;min-height:3em}
.bubble::after{content:"";position:absolute;left:36px;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.bubble sup{color:#6a3fc0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;padding:20px 24px;border-radius:28px;background:linear-gradient(160deg,var(--tunnel-2),var(--tunnel));border:2px solid var(--root);margin-bottom:28px}
.hero .left{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .niff{justify-self:center}
.kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:900}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:22px;background:var(--tunnel);border:2px solid var(--root);min-height:150px}
.topic .glyph{font-family:var(--display);font-size:2.2rem;color:var(--gold);line-height:1;margin-bottom:6px}
.topic.open{border-color:var(--gold-deep);background:linear-gradient(170deg,#4a3566,var(--tunnel))}
.topic.locked{opacity:.6;cursor:default}
.topic.locked .glyph{color:var(--ink-dim)}
.tag{display:inline-block;font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--soil-2);color:var(--ink-dim);margin-top:auto}
.topic.open .tag{background:var(--gold);color:#2b1d07}

/* topic screen */
.topic-head{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.formula{font-family:var(--display);font-size:1.4rem;color:var(--gold)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:24px;background:var(--tunnel);border:2px solid var(--root)}
.game .glyph{font-family:var(--display);font-size:2.4rem;color:var(--gold);line-height:1}
.game .row{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.game .row .btn{flex:1 1 120px}
.game .row .btn.mm{flex-basis:100%}
.btn.mm{background:linear-gradient(135deg,#7a1f3d,#b8325c);border-color:#ff7aa5;color:#fff;box-shadow:0 4px 0 #4f1027}
.btn.mm:active{box-shadow:0 1px 0 #4f1027}
.lvl.mm{background:linear-gradient(135deg,#7a1f3d,#b8325c);color:#fff}
.prog{font-size:.9rem;color:var(--ink-dim);display:flex;gap:12px;flex-wrap:wrap}
.prog b{color:var(--good)}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.extra{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 20px;border-radius:24px;background:var(--soil-2);border:2px dashed var(--root);min-height:84px}
.extra .glyph{font-family:var(--display);font-size:1.8rem;color:var(--gem1)}

/* play */
.play-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:8px;margin-left:auto}
.dot{width:18px;height:18px;border-radius:50%;background:var(--soil-2);border:2px solid var(--root)}
.dot.done{background:var(--gold);border-color:var(--gold-deep)}
.dot.now{border-color:var(--gold);transform:scale(1.25)}
.lvl{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--tunnel-2)}
.lvl.adv{background:#5b3fa0}
.play-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.play-niff{display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:12px}
.play-niff .bubble{order:-1;font-size:.95rem}
.play-niff .niff{max-width:170px}
.qcard{padding:24px;border-radius:28px;background:var(--tunnel);border:2px solid var(--root);display:flex;flex-direction:column;gap:18px;min-width:0}
.qtitle{font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.prompt{font-size:1.3rem;line-height:1.5;font-weight:800}
.big{display:inline-block;font-family:var(--display);font-weight:400;font-size:2.1rem;letter-spacing:.02em;line-height:1.5;margin-top:4px}
.claim{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--gold);padding:10px 18px;margin:8px 0;border-radius:18px;background:var(--soil-2);display:inline-block}
.slot{display:inline-block;min-width:1.3em;padding:0 .15em;text-align:center;color:var(--gold);border-bottom:4px dashed var(--gold);line-height:1.1}
.slot.filled{border-bottom-style:solid}
.fig{display:block;width:100%;height:auto;margin:0 auto}
.coin{fill:var(--gold);stroke:var(--gold-deep);stroke-width:2}
.coin-in{fill:none;stroke:var(--gold-deep);stroke-width:1.5;opacity:.7}
.gem{stroke:rgba(255,255,255,.55);stroke-width:1.5}
.cube-top{fill:var(--cube-top);stroke:#7a4f12;stroke-width:1.2}
.cube-l{fill:var(--cube-l);stroke:#7a4f12;stroke-width:1.2}
.cube-r{fill:var(--cube-r);stroke:#7a4f12;stroke-width:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:72px;padding:14px;border-radius:18px;background:var(--tunnel-2);border:3px solid var(--root);font-family:var(--display);font-size:1.45rem;font-weight:400;line-height:1.3}
.opt.small{font-family:var(--body);font-weight:800;font-size:1.05rem}
.opt.right{border-color:var(--good);background:#235a45}
.opt.wrong{border-color:var(--oops);opacity:.55}
.display{min-height:64px;border-radius:16px;background:var(--soil-2);border:3px solid var(--root);font-family:var(--display);font-size:2rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px;width:100%;margin:0 auto}
.key{min-height:64px;border-radius:16px;background:var(--tunnel-2);border:2px solid var(--root);font-family:var(--display);font-size:1.7rem;box-shadow:0 3px 0 var(--soil)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.check{grid-column:1/-1;background:var(--gold);color:#2b1d07;border-color:var(--gold-deep);box-shadow:0 4px 0 var(--gold-deep);font-size:1.4rem}
.pad.off .key{opacity:.4;pointer-events:none}
.feedback{font-size:1.1rem;font-weight:800;min-height:1.5em}
.feedback .good{color:var(--good);font-family:var(--display);font-weight:400;font-size:1.5rem}
.feedback .oops{color:var(--oops)}
.explain{margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--soil-2);font-weight:700;color:var(--ink)}
.mischief{margin-top:10px;padding:12px 16px;border-radius:14px;background:#4d2f14;border:2px dashed var(--gold);color:var(--gold)}
.qactions{display:flex;gap:12px;flex-wrap:wrap}
.hints{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;color:var(--gem1);font-weight:800}
.hints:empty{display:none}

/* end */
.end{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:center;padding:24px;border-radius:28px;background:linear-gradient(160deg,var(--tunnel-2),var(--tunnel));border:2px solid var(--gold-deep)}
.end .stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:12px 16px;border-radius:16px;background:var(--soil-2);min-width:120px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.found{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:20px;background:var(--soil-2);border:2px solid var(--root)}
.found .shiny{width:72px;height:72px;flex:none}
.wonder{padding:16px 18px;border-radius:20px;background:#163246;border:2px solid var(--gem1)}
.wonder .kicker{color:var(--gem1)}
.end-actions{display:flex;gap:12px;flex-wrap:wrap}

/* hoard */
.hoard-top{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:24px}
.hoard-niff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border-radius:28px;background:radial-gradient(circle at 50% 70%,#4a3566,var(--tunnel));border:2px solid var(--root)}
.section-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border-radius:18px;background:var(--tunnel);border:2px solid var(--root);min-height:110px}
.item.on{border-color:var(--good)}
.item .cost{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;margin-top:auto;font-weight:900}
.item .cost .coin-ico{width:18px;height:18px}
.item .swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--soil)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.cell{aspect-ratio:1;border-radius:16px;background:var(--soil-2);border:2px solid var(--root);display:flex;align-items:center;justify-content:center;padding:8px}
.cell .shiny{width:100%;height:100%}
.cell.empty{border-style:dashed;opacity:.5}
.cell.empty::after{content:"?";font-family:var(--display);font-size:1.4rem;color:var(--root)}
.shiny.rare{filter:drop-shadow(0 0 6px rgba(255,240,170,.85))}
.wonders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wonders .wonder.locked{background:var(--soil-2);border-color:var(--root);border-style:dashed;color:var(--ink-dim)}

/* notes + grown-ups */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.note{padding:16px 18px;border-radius:20px;background:var(--tunnel);border:2px solid var(--root);display:flex;flex-direction:column;gap:6px}
.note .ex{font-family:var(--display);font-size:1.4rem;color:var(--gold)}
.form{display:grid;gap:14px;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text]{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--root);background:var(--soil-2);color:var(--ink);min-height:52px}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px}
.toggle input{width:28px;height:28px;accent-color:var(--gold)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;min-width:520px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--root)}
th{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
footer{margin-top:40px;display:flex;justify-content:center}
.linkbtn{color:var(--ink-dim);text-decoration:underline;padding:12px}

.flycoin{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);pointer-events:none;z-index:50}
.rain{position:fixed;top:-30px;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);pointer-events:none;z-index:40;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* shapes */
.f-gold-t{fill:var(--cube-top);stroke:#7a4f12;stroke-width:1.2;stroke-linejoin:round}
.f-gold-l{fill:var(--cube-l);stroke:#7a4f12;stroke-width:1.2;stroke-linejoin:round}
.f-gold-r{fill:var(--cube-r);stroke:#7a4f12;stroke-width:1.2;stroke-linejoin:round}
.f-blue-t{fill:#aee3ff;stroke:#1d4c6e;stroke-width:1.2;stroke-linejoin:round}
.f-blue-l{fill:#66b8ea;stroke:#1d4c6e;stroke-width:1.2;stroke-linejoin:round}
.f-blue-r{fill:#3f8cc4;stroke:#1d4c6e;stroke-width:1.2;stroke-linejoin:round}
.f-pink-t{fill:#ffbfdc;stroke:#7a2850;stroke-width:1.2;stroke-linejoin:round}
.f-pink-l{fill:#f287b6;stroke:#7a2850;stroke-width:1.2;stroke-linejoin:round}
.f-pink-r{fill:#c95a8a;stroke:#7a2850;stroke-width:1.2;stroke-linejoin:round}
.gl{stroke:rgba(30,15,0,.42);stroke-width:1}
.wire{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round}
.wire-h{stroke:var(--ink-dim);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.iso-lbl{fill:var(--ink);font-family:var(--body);font-weight:900;font-size:16px}
.iso-lbl.face{fill:#2b1d07;font-size:15px}
.fs-out{fill:none;stroke:var(--ink);stroke-width:3}
.fs-in{stroke:var(--ink-dim);stroke-width:1.5;stroke-dasharray:5 4}
.fs-tile{fill:var(--gem1);fill-opacity:.6}
.fs-cell{fill:var(--tunnel-2);stroke:var(--ink-dim);stroke-width:1.2}
.fs-half{fill:var(--gem2);fill-opacity:.45;stroke:var(--ink-dim);stroke-width:1.2}
.frac{white-space:nowrap}
.frac sup,.frac sub{font-size:.62em}
.build-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.build-fig{display:flex;justify-content:center;align-items:center;min-height:320px}
.build-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.build-niff{display:flex;align-items:center;gap:14px}
.build-niff .niff{max-width:96px;flex:none}
.build-niff .bubble{flex:1;font-size:.95rem}
.build-niff .bubble::after{display:none}
.steppers{display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:84px 64px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;background:var(--tunnel);border:2px solid var(--root)}
.stepper .slabel{font-weight:900}
.stepper b{font-family:var(--display);font-weight:400;font-size:2.1rem;text-align:center;font-variant-numeric:tabular-nums}
.sbtn{min-height:60px;border-radius:16px;background:var(--tunnel-2);border:2px solid var(--root);font-family:var(--display);font-size:2rem;box-shadow:0 3px 0 var(--soil)}
.sbtn:active{transform:translateY(2px);box-shadow:none}
.sbtn:disabled{opacity:.3}
.readout{font-family:var(--display);font-size:1.7rem;text-align:center;font-variant-numeric:tabular-nums}
.readout b{color:var(--gold);font-weight:400}
.found-list{display:flex;gap:8px;flex-wrap:wrap}
.found-list:empty{display:none}
.chip{padding:6px 12px;border-radius:999px;background:#235a45;border:2px solid var(--good);font-weight:900}
.iso{overflow:visible}
@media (max-width:720px){ .build-grid{grid-template-columns:1fr} }
/* fractions */
.wedge{fill:#f6dca6;stroke:#9a5f22;stroke-width:3;stroke-linejoin:round;cursor:pointer}
.wedge.on{fill:#e2475b}
.crust{fill:#d99a4e}
.pie{touch-action:manipulation}
.ix-stage{display:flex;justify-content:center;align-items:center;min-height:320px}
.ix-stage.drag{touch-action:none}
.ix-controls{display:flex;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:10px}
.palbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:64px;padding:10px 12px;border-radius:16px;background:var(--tunnel);border:2px solid var(--root);font-family:var(--display);font-size:1.3rem}
.palbtn:disabled{opacity:.4}
.palbar{display:block;height:20px;border-radius:5px;border:2px solid rgba(0,0,0,.25)}
.wall-whole{fill:none;stroke:var(--ink);stroke-width:3}
.wall-target{fill:rgba(247,199,75,.12);stroke:var(--gold);stroke-width:3;stroke-dasharray:8 6}
.wpiece{cursor:pointer}
.wlbl{font-family:var(--display);font-size:18px;fill:#2b1d07}
.nl{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.nl.minor{stroke-width:2.5;opacity:.75}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fin{display:flex;align-items:center;justify-content:center;gap:14px}
.fstack{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbar{display:block;width:84px;height:4px;border-radius:2px;background:var(--ink)}
.fbox{width:84px;height:60px;border-radius:14px;background:var(--soil-2);border:3px solid var(--root);font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.fbox.w{height:84px}
.fbox.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,199,75,.25)}
.fin-tip{text-align:center;font-size:.95rem}
.lbl .frac sup,.lbl .frac sub{font-size:.7em}
/* gallery + vault */
.gal-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.gal-frame{position:relative;width:100%;max-width:520px;aspect-ratio:1;border-radius:24px;overflow:hidden;border:3px solid var(--gold-deep);background:var(--soil-2)}
.gal-frame .animal{position:absolute;inset:0;width:100%;height:100%}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#3a2d50;background-image:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.5px);background-size:14px 14px;border:1.5px solid #20172c;color:var(--gold);transition:opacity .4s,transform .4s}
.tile span{font-family:var(--display);font-size:2rem;line-height:1}
.tile small{font-weight:900;font-size:.72rem;color:var(--ink-dim)}
.tile:hover:not(.open){background-color:#4a3966}
.tile.open{opacity:0;transform:scale(.5);pointer-events:none}
.gal-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.starguide{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:var(--soil-2);font-size:.95rem}
.stars{color:var(--gold);font-size:2rem;letter-spacing:.12em}
.stars-sm{color:var(--gold);letter-spacing:.1em}
.star-off{color:var(--root)}
.pic{width:100%;aspect-ratio:1;background:var(--soil-2)}
.gal-frame .pic{position:absolute;inset:0;aspect-ratio:auto}
.pic .animal,.gal-frame img.animal{display:block;width:100%;height:100%}
img.photo{object-fit:cover;aspect-ratio:1}
.card img.photo{display:block;width:100%}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gtab{min-height:52px;padding:10px 18px;border-radius:999px;background:var(--tunnel);border:2px solid var(--root);font-weight:900;font-size:1.02rem}
.gtab.on{background:var(--tunnel-2);border-color:var(--gold);color:var(--gold)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.plist{display:grid;gap:12px;margin-top:12px}
.prow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border-radius:18px;background:var(--tunnel);border:2px solid var(--gem1)}
.prow.saved{border-color:var(--root)}
.prow img{width:140px;height:140px;object-fit:cover;border-radius:12px}
.pfields{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:460px){ .prow{grid-template-columns:1fr} .prow img{width:100%;height:auto;aspect-ratio:1} }
.guess{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gbtn{min-height:54px;padding:8px 10px;border-radius:14px;background:var(--tunnel-2);border:2px solid var(--root);font-weight:900;font-size:1.02rem}
.gbtn:hover:not(:disabled){border-color:var(--gold)}
.gbtn.no{text-decoration:line-through;opacity:.35}
.gbtn:disabled:not(.no){opacity:.55}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border-radius:20px;background:var(--tunnel);border:2px solid var(--root);overflow:hidden;display:flex;flex-direction:column}
.card .animal{display:block;width:100%;height:auto}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.card.locked{border-style:dashed;min-height:190px;align-items:center;justify-content:center;font-family:var(--display);font-size:3rem;color:var(--root)}
.vstory{padding:22px 24px;border-radius:24px;background:linear-gradient(160deg,#2a2347,var(--tunnel));border:2px solid var(--gold-deep);display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:20px;align-items:center;font-size:1.1rem}
.vstory ol{margin:10px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.villo svg{width:100%;height:auto;display:block}
.vq{margin-top:12px;font-family:var(--display);font-size:1.6rem;color:var(--gold)}
.vanswer{margin-top:18px;padding:18px 20px;border-radius:22px;background:var(--tunnel);border:2px solid var(--root);display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vin{font:inherit;font-family:var(--display);font-size:1.8rem;width:150px;min-height:60px;padding:6px 12px;border-radius:14px;border:3px solid var(--root);background:var(--soil-2);color:var(--ink);text-align:center}
.vin:focus{border-color:var(--gold);outline:none}
.clues{display:grid;gap:12px}
.clue{padding:14px 16px;border-radius:18px;background:var(--soil-2);border:2px dashed var(--root);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clue.open{border-style:solid;border-color:var(--gem1)}
.clue.solved{border-style:solid;border-color:var(--good)}
.solution{margin-top:14px}
.solution ol{margin:6px 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
@media (max-width:720px){ .gal-grid,.vstory{grid-template-columns:1fr} .villo{max-width:160px} }
/* balloon pop */
.bal-prompt{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;border-radius:24px;background:var(--tunnel);border:2px solid var(--root);margin-bottom:12px}
.bal-prompt .ask{font-family:var(--display);font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.15}
.bal-prompt .sub{display:block;font-family:var(--body);font-size:1rem;color:var(--ink-dim);font-weight:800;margin-top:2px}
.bal-prompt .bubble{margin-left:auto;font-size:.95rem;max-width:280px;min-height:0}
.bal-prompt .bubble::after{display:none}
.stage{position:relative;height:min(64vh,620px);min-height:420px;border-radius:28px;overflow:hidden;border:2px solid var(--root);background:linear-gradient(180deg,#2d4373 0%,#3c3062 58%,#2a1f38 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 18%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(2px 2px at 64% 9%,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(2px 2px at 86% 30%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(2px 2px at 40% 36%,rgba(255,255,255,.3) 50%,transparent 51%);pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:44px;background:#3a2a1e;border-top:4px solid #5c4231;z-index:2;pointer-events:none}
.balloon{position:absolute;left:0;top:0;width:112px;height:152px;cursor:pointer;will-change:transform;z-index:1}
.balloon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.balloon .lbl{position:absolute;left:4px;right:4px;top:36px;text-align:center;font-family:var(--display);font-size:1.8rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);pointer-events:none;line-height:1;white-space:nowrap}
.balloon .lbl.sm{font-size:1.35rem;top:42px}
.balloon.glow svg{filter:drop-shadow(0 0 10px #fff6c2) drop-shadow(0 0 4px #fff6c2)}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;z-index:4}
.popword{position:absolute;font-family:var(--display);font-size:2.2rem;color:var(--gold);pointer-events:none;z-index:4;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.stage-niff{position:absolute;left:10px;bottom:14px;width:92px;z-index:0;pointer-events:none}
.stage-niff .niff{max-width:92px;cursor:default}
.bal-feedback{min-height:2.6em;margin-top:12px;font-weight:800;font-size:1.1rem}
.bal-feedback .good{color:var(--good);font-family:var(--display);font-weight:400;font-size:1.5rem}
.bal-feedback .oops{color:var(--oops)}
.game.featured{border-color:var(--gem1);background:linear-gradient(170deg,#28456a,var(--tunnel))}
.game.featured .glyph{color:var(--gem1)}
@media (max-width:720px){
  .hero,.end,.hoard-top{grid-template-columns:1fr}
  .hero .niff{max-width:170px;grid-row:1}
  .play-grid{grid-template-columns:1fr}
  .play-niff{position:static;flex-direction:row;align-items:center}
  .play-niff .bubble{order:2;flex:1}
  .play-niff .niff{max-width:96px}
  .end .niff{max-width:150px;justify-self:center}
}
@media (max-width:460px){
  .opts{grid-template-columns:1fr}
  .big{font-size:1.7rem}
  .claim{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <button class="brand" data-go="home">Niffler's Hoard</button>
    <nav>
      <button class="navbtn" data-go="home" id="nav-home">Burrows</button>
      <button class="navbtn" data-go="gallery" id="nav-gallery">Gallery</button>
      <button class="navbtn" data-go="hoard" id="nav-hoard">Hoard Room</button>
    </nav>
    <div class="purse" id="purse" aria-label="coins"><span class="coin-ico"></span><b id="coinCount">0</b></div>
  </header>

  <main>
    <section id="scr-home"></section>
    <section id="scr-topic" hidden></section>
    <section id="scr-play" hidden>
      <div class="play-top">
        <button class="btn" id="leaveBtn">&larr; Back to tunnel</button>
        <span class="lvl" id="lvlTag">Basic</span>
        <div class="dots" id="dots"></div>
      </div>
      <div class="play-grid">
        <aside class="play-niff">
          <div class="bubble" id="playBubble"></div>
          <div class="niff" id="playNiff"></div>
        </aside>
        <div class="qcard">
          <div class="qtitle" id="qTitle"></div>
          <div class="prompt" id="qPrompt"></div>
          <div id="qFig"></div>
          <div id="qAnswer"></div>
          <div class="feedback" id="qFeedback" aria-live="polite"></div>
          <ol class="hints" id="hintList"></ol>
          <div class="qactions">
            <button class="btn" id="hintBtn">Hint</button>
            <button class="btn gold" id="nextBtn" hidden>Next &rarr;</button>
          </div>
        </div>
      </div>
    </section>
    <section id="scr-balloon" hidden>
      <div class="play-top">
        <button class="btn" id="balLeave">&larr; Back to tunnel</button>
        <span class="lvl" id="balLvl">Basic</span>
        <div class="dots" id="balDots"></div>
      </div>
      <div class="bal-prompt">
        <div><div class="ask" id="balAsk"></div><span class="sub" id="balSub"></span></div>
        <div class="bubble" id="balBubble"></div>
      </div>
      <div class="stage" id="stage">
        <div class="stage-niff"><div class="niff" id="balNiff"></div></div>
        <div class="ground"></div>
      </div>
      <div class="bal-feedback" id="balFeedback" aria-live="polite"></div>
    </section>
    <section id="scr-build" hidden>
      <div class="play-top">
        <button class="btn" id="buildLeave">&larr; Back to tunnel</button>
        <span class="lvl" id="buildLvl">Basic</span>
        <div class="dots" id="buildDots"></div>
      </div>
      <div class="build-grid">
        <div class="qcard">
          <div class="qtitle">Box Builder</div>
          <div class="prompt"><span id="buildAsk"></span><span class="sub dim" id="buildSub" style="display:block;font-size:1rem;margin-top:4px"></span></div>
          <div class="build-fig" id="buildFig"></div>
          <div class="readout" id="buildRead"></div>
        </div>
        <div class="build-side">
          <div class="build-niff"><div class="niff" id="buildNiff"></div><div class="bubble" id="buildBubble"></div></div>
          <div class="steppers">
            <div class="stepper"><span class="slabel">Length</span><button class="sbtn" data-dim="l" data-d="-1" aria-label="shorter">−</button><b id="dim-l">2</b><button class="sbtn" data-dim="l" data-d="1" aria-label="longer">+</button></div>
            <div class="stepper"><span class="slabel">Width</span><button class="sbtn" data-dim="w" data-d="-1" aria-label="narrower">−</button><b id="dim-w">2</b><button class="sbtn" data-dim="w" data-d="1" aria-label="wider">+</button></div>
            <div class="stepper"><span class="slabel">Height</span><button class="sbtn" data-dim="h" data-d="-1" aria-label="lower">−</button><b id="dim-h">2</b><button class="sbtn" data-dim="h" data-d="1" aria-label="taller">+</button></div>
          </div>
          <div class="found-list" id="buildFound"></div>
          <button class="btn gold" id="buildCheck">Check my box</button>
          <div class="feedback" id="buildFeedback" aria-live="polite"></div>
          <button class="btn gold" id="buildNext" hidden>Next box &rarr;</button>
        </div>
      </div>
    </section>
    <section id="scr-ix" hidden>
      <div class="play-top">
        <button class="btn" id="ixLeave">&larr; Back to tunnel</button>
        <span class="lvl" id="ixLvl">Basic</span>
        <div class="dots" id="ixDots"></div>
      </div>
      <div class="build-grid">
        <div class="qcard">
          <div class="qtitle" id="ixTitle"></div>
          <div class="prompt"><span id="ixAsk"></span><span class="dim" id="ixSub" style="display:block;font-size:1rem;margin-top:4px"></span></div>
          <div class="ix-stage" id="ixStage"></div>
          <div class="readout" id="ixRead"></div>
        </div>
        <div class="build-side">
          <div class="build-niff"><div class="niff" id="ixNiff"></div><div class="bubble" id="ixBubble"></div></div>
          <div class="ix-controls" id="ixControls"></div>
          <button class="btn gold" id="ixCheck">Check</button>
          <div class="feedback" id="ixFeedback" aria-live="polite"></div>
          <button class="btn gold" id="ixNext" hidden>Next &rarr;</button>
        </div>
      </div>
    </section>
    <section id="scr-end" hidden></section>
    <section id="scr-hoard" hidden></section>
    <section id="scr-gallery" hidden></section>
    <section id="scr-vault" hidden></section>
    <section id="scr-notes" hidden></section>
    <section id="scr-grown" hidden></section>
  </main>

  <footer><button class="linkbtn" data-go="grown">Grown-up settings</button></footer>
</div>

<script>
(() => {
'use strict';
/* ---------- state ---------- */
const KEY = 'nifflersHoard.v1';
const DEFAULT = {coins:0, shinies:[], owned:[], wear:{}, fur:'lilac', furs:['lilac'], name:'Niffler', player:'friend',
  stats:{}, wonders:[], settings:{sound:true, speak:false, hints:true}, tickleDay:'', tickles:0,
  gallery:{cur:0, tiles:[], choices:[], wrong:[], reveal:false, done:[]}, travel:{cur:null, tiles:[], choices:[], wrong:[], reveal:false, done:[]}, vault:{opened:[false,false,false], clueOk:[false,false,false], solved:false, stars:0, openedAtSolve:0, bonus:false}};
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY));
    if (r && typeof r === 'object') { const s = Object.assign(clone(DEFAULT), r); s.settings = Object.assign({}, DEFAULT.settings, r.settings || {}); return s; }
  } catch(e) {}
  return clone(DEFAULT);
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const P = (a,b) => `${a}<sup>${b}</sup>`;
const fmt = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:6});
const SLOT = '<span class="slot"></span>';
const times = (a,n) => Array(n).fill(a).join(' × ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

const pad = (key,prompt,answer,hints,explain,fig='') => ({type:'pad',key,prompt,answer,hints,explain,fig});
const mcq = (key,prompt,options,hints,explain,fig='',small=false) => ({type:'mcq',key,prompt,options:options.map(String),hints,explain,fig,small});
// claim: options[0] is always the correct choice
function claim(key,text,truth,fix,wrongs,explain){
  const lab = w => (w && typeof w==='object') ? w.raw : `Wrong, it should be ${w}`;
  const opts = truth ? ['Niffler is right!', ...wrongs.slice(0,2).map(lab)]
                     : [lab(fix), 'Niffler is right!', ...wrongs.slice(0,1).map(lab)];
  return mcq(key, `Niffler puffs out its chest and says:<br><span class="claim">${text}</span><br>Is Niffler right?`, opts,
    ['Work it out yourself first, then compare.', 'Write the powers out as multiplication.', 'Niffler likes to rush. Check every step.'], explain, '', true);
}

/* ---------- figures ---------- */
function coinsFig(n){
  const per=8, r=11, g=27, rows=Math.ceil(n/per), w=Math.min(n,per)*g+6, h=rows*g+6;
  let s=''; for (let i=0;i<n;i++){ const x=3+r+(i%per)*g, y=3+r+Math.floor(i/per)*g;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" class="coin"/><circle cx="${x}" cy="${y}" r="${r-4}" class="coin-in"/>`; }
  return `<svg class="fig" viewBox="0 0 ${w} ${h}" style="max-width:${Math.round(w*1.3)}px" role="img" aria-label="${n} coins">${s}</svg>`;
}
function gemGrid(n,layered=false){
  const g=36, w=n*g+6; let s='';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){ const x=3+c*g+g/2, y=3+r*g+g/2, layer=Math.max(r,c);
    const fill = layered ? (layer%2 ? 'var(--gem2)' : 'var(--gem1)') : 'var(--gem1)';
    s+=`<path d="M${x} ${y-13}L${x+12} ${y}L${x} ${y+13}L${x-12} ${y}Z" fill="${fill}" class="gem"/>`; }
  return `<svg class="fig" viewBox="0 0 ${w} ${w}" style="max-width:${Math.min(Math.round(w*1.15),330)}px" role="img" aria-label="${n} by ${n} square of gems">${s}</svg>`;
}
function isoCube(n){
  const u=Math.min(30,120/n), c=.866, pt=(x,y,z)=>[(x-y)*u*c,(x+y)*u*.5-z*u]; let s='';
  const q=(pts,cls)=>{ s+=`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" class="${cls}"/>`; };
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    q([pt(i,j,n),pt(i+1,j,n),pt(i+1,j+1,n),pt(i,j+1,n)],'cube-top');
    q([pt(n,i,j),pt(n,i+1,j),pt(n,i+1,j+1),pt(n,i,j+1)],'cube-r');
    q([pt(i,n,j),pt(i+1,n,j),pt(i+1,n,j+1),pt(i,n,j+1)],'cube-l');
  }
  const W=n*u*c, H=n*u;
  return `<svg class="fig" viewBox="${(-W-4).toFixed(1)} ${(-H-4).toFixed(1)} ${(2*W+8).toFixed(1)} ${(2*H+8).toFixed(1)}" style="max-width:260px" role="img" aria-label="cube of blocks">${s}</svg>`;
}

/* ---------- question generators: Exponent Tunnel ---------- */
const G = {};
G.double = { basic:[
  () => { const n=ri(2,5), v=2**n; return pad('d1'+n, `Niffler finds 1 coin. Every night the pile <b>doubles</b>. How many coins after <b>${plural(n,'night')}</b>?`, v,
    ['Night 1: 1 × 2 = 2 coins.', 'Keep multiplying by 2: 2, 4, 8, 16 …', `That is 2 multiplied ${n} times, written ${P(2,n)}.`],
    `${P(2,n)} = ${times(2,n)} = ${v} coins.`, coinsFig(v)); },
  () => { const s=pick([3,5,10]), n=ri(2,3), v=s*2**n; return pad('d2'+s+n, `Niffler starts with <b>${s} coins</b>. The pile doubles every night. How many coins after <b>${n} nights</b>?`, v,
    [`After night 1: ${s} × 2 = ${s*2}.`, 'Each night, multiply by 2 again.', `${s} × ${P(2,n)} = ${s} × ${2**n}.`],
    `${s} × ${P(2,n)} = ${s} × ${2**n} = ${v} coins.`); },
  () => { const n=ri(3,6); return pad('d3'+n, `Write it the short way:<br><span class="big">${times(2,n)} = 2<sup>${SLOT}</sup></span>`, n,
    ['Count how many 2s are multiplied.', 'The exponent is the count of 2s.', `Point at each 2 and count: 1, 2, 3 …`],
    `${n} twos multiplied together is ${P(2,n)} = ${2**n}.`); },
  () => { const T=pick([20,50,100]); let n=0; while (2**n<=T) n++;
    return pad('d4'+T, `Niffler starts with 1 coin and the pile doubles every night. After how many nights does Niffler have <b>more than ${T}</b> coins?`, n,
    ['List the piles: 2, 4, 8, 16, 32, 64, 128, 256, 512 …', 'Night 1 = 2, night 2 = 4, night 3 = 8 …', `Find the first pile bigger than ${T}.`],

/* ---------- isometric drawing (Shapes & Volume) ---------- */
function isoScene(boxes, opts={}){
  const C=.866, raw=(x,y,z)=>[(x-y)*C,(x+y)*.5-z];
  const all = boxes.slice(); if (opts.wire) all.push({x:0,y:0,z:0,...opts.wire}); if (opts.frame) all.push({x:0,y:0,z:0,...opts.frame});
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (const b of all) for (const x of [b.x,b.x+b.l]) for (const y of [b.y,b.y+b.w]) for (const z of [b.z,b.z+b.h]){ const [sx,sy]=raw(x,y,z); x0=Math.min(x0,sx); x1=Math.max(x1,sx); y0=Math.min(y0,sy); y1=Math.max(y1,sy); }
  const u = Math.min(opts.maxU||34, (opts.width||300)/Math.max(.1,x1-x0), (opts.height||250)/Math.max(.1,y1-y0));
  const pt=(x,y,z)=>{ const [a,b]=raw(x,y,z); return [a*u,b*u]; };
  const f=v=>v.toFixed(1);
  const poly=(pts,cls)=>`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" class="${cls}"/>`;
  const line=(a,b,cls)=>{ const p=pt(...a), q=pt(...b); return `<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" class="${cls}"/>`; };
  let s='';
  if (opts.wire){ const {l,w,h}=opts.wire; s+=line([0,0,0],[l,0,0],'wire-h')+line([0,0,0],[0,w,0],'wire-h')+line([0,0,0],[0,0,h],'wire-h'); }
  const sorted=boxes.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y) || a.z-b.z);
  for (const b of sorted){ const {x,y,z,l,w,h}=b, X=x+l, Y=y+w, Z=z+h, c=b.color||opts.color||'gold';
    s+=poly([pt(x,y,Z),pt(X,y,Z),pt(X,Y,Z),pt(x,Y,Z)],`f-${c}-t`);
    s+=poly([pt(X,y,z),pt(X,Y,z),pt(X,Y,Z),pt(X,y,Z)],`f-${c}-r`);
    s+=poly([pt(x,Y,z),pt(X,Y,z),pt(X,Y,Z),pt(x,Y,Z)],`f-${c}-l`);
    if (opts.grid!==false){
      for (let i=x+1;i<X-.01;i++){ s+=line([i,y,Z],[i,Y,Z],'gl')+line([i,Y,z],[i,Y,Z],'gl'); }
      for (let j=y+1;j<Y-.01;j++){ s+=line([x,j,Z],[X,j,Z],'gl')+line([X,j,z],[X,j,Z],'gl'); }
      for (let k=z+1;k<Z-.01;k++){ s+=line([X,y,k],[X,Y,k],'gl')+line([x,Y,k],[X,Y,k],'gl'); }
    }
  }
  if (opts.wire){ const {l,w,h}=opts.wire;
    s+=`<polygon points="${[pt(0,0,h),pt(l,0,h),pt(l,w,h),pt(0,w,h)].map(p=>f(p[0])+','+f(p[1])).join(' ')}" class="wire"/>`;
    s+=line([l,0,0],[l,0,h],'wire')+line([l,w,0],[l,w,h],'wire')+line([0,w,0],[0,w,h],'wire')+line([l,0,0],[l,w,0],'wire')+line([0,w,0],[l,w,0],'wire'); }
  const cx=(x0+x1)/2*u, cy=(y0+y1)/2*u;
  for (const L of (opts.labels||[])){ const p=pt(...L.a), q=pt(...L.b), mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2;
    let dx=mx-cx, dy=my-cy; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const tx=mx+dx*20, ty=my+dy*20+5, anchor = dx>.35?'start':dx<-.35?'end':'middle';
    s+=`<text x="${f(tx)}" y="${f(ty)}" text-anchor="${anchor}" class="iso-lbl">${L.t}</text>`; }
  for (const F of (opts.faceLabels||[])){ const p=pt(...F.at); s+=`<text x="${f(p[0])}" y="${f(p[1]+5)}" text-anchor="middle" class="iso-lbl face">${F.t}</text>`; }
  const pad=opts.pad||70, vx=x0*u-pad, vy=y0*u-36, vw=(x1-x0)*u+2*pad, vh=(y1-y0)*u+72;
  return `<svg class="fig iso" viewBox="${f(vx)} ${f(vy)} ${f(vw)} ${f(vh)}" style="max-width:${Math.round(Math.min(opts.maxW||420, vw*1.1))}px" role="img" aria-label="${opts.aria||'box made of cubes'}">${s}</svg>`;
}
function partialFig(l,w,h){
  const c=[]; for (let i=0;i<l;i++) c.push({x:i,y:w-1,z:0,l:1,w:1,h:1});
  for (let j=0;j<w-1;j++) c.push({x:l-1,y:j,z:0,l:1,w:1,h:1});
  for (let k=1;k<h;k++) c.push({x:l-1,y:w-1,z:k,l:1,w:1,h:1});

/* ---------- fractions: helpers ---------- */
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while (b){ [a,b]=[b,a%b]; } return a||1; };
const simp = (n,d) => { const g=gcd(n,d); return [n/g,d/g]; };
const fadd = (a,b) => simp(a[0]*b[1]+b[0]*a[1], a[1]*b[1]);
const fsub = (a,b) => simp(a[0]*b[1]-b[0]*a[1], a[1]*b[1]);
const fmul = (a,b) => simp(a[0]*b[0], a[1]*b[1]);
function fh(n,d){ [n,d]=simp(n,d); if (d===1) return String(n); const w=Math.floor(n/d), r=n-w*d; return w ? `${w}${fr(r,d)}` : fr(n,d); }
const fpad = (key,prompt,ans,hints,explain,fig='',opt={}) => ({type:'pad', frac:true, key, prompt, answer:simp(ans[0],ans[1]), hints, explain, fig, simplest:!!opt.simplest});
const PIE_FILL='#e2475b';
function piesFig(a,b){
  const r=26, gap=12, w=a*(2*r+gap); let s='';
  for (let i=0;i<a;i++){ const cx=r+4+i*(2*r+gap); s+=`<circle cx="${cx}" cy="34" r="${r}" fill="#f2cf8f" stroke="#9a5f22" stroke-width="3"/><circle cx="${cx}" cy="34" r="${r-7}" fill="${PIE_FILL}" opacity=".85"/>`; }
  let n=''; for (let j=0;j<b;j++){ const cx=22+j*44; n+=`<g transform="translate(${cx},100)"><circle cx="-11" cy="-12" r="8" fill="#a99bd5"/><circle cx="11" cy="-12" r="8" fill="#a99bd5"/><circle r="15" fill="#a99bd5"/><circle cx="-5" cy="-2" r="2.5" fill="#251a30"/><circle cx="5" cy="-2" r="2.5" fill="#251a30"/><ellipse cx="0" cy="5" rx="3" ry="2" fill="#f27aa1"/></g>`; }
  const W=Math.max(w, b*44)+10;
  return `<svg class="fig" viewBox="0 0 ${W} 124" style="max-width:${Math.min(460,W*1.3)}px" role="img" aria-label="${a} pies shared by ${b} nifflers">${s}${n}</svg>`;
}
function gardenFig(a,n,b,m){
  const W=300, H=200, o=60; let s=`<rect x="${o}" y="20" width="${W}" height="${H}" fill="#3b5a2c" stroke="var(--ink)" stroke-width="3"/>`;
  s+=`<rect x="${o}" y="20" width="${W*n/a}" height="${H}" fill="#4fc3f7" opacity=".55"/><rect x="${o}" y="20" width="${W}" height="${H*m/b}" fill="#ff7fb5" opacity=".55"/>`;
  for (let i=1;i<a;i++) s+=`<line x1="${o+W*i/a}" y1="20" x2="${o+W*i/a}" y2="${20+H}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  for (let j=1;j<b;j++) s+=`<line x1="${o}" y1="${20+H*j/b}" x2="${o+W}" y2="${20+H*j/b}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<rect x="${o}" y="20" width="${W}" height="${H}" fill="none" stroke="var(--ink)" stroke-width="3"/>`;
  s+=`<text x="${o+W*n/a/2}" y="14" text-anchor="middle" class="iso-lbl">${n}/${a}</text><text x="${o-8}" y="${20+H*m/b/2+5}" text-anchor="end" class="iso-lbl">${m}/${b}</text>`;
  return `<svg class="fig" viewBox="0 0 ${W+o+20} ${H+34}" style="max-width:400px" role="img" aria-label="garden grid">${s}</svg>`;
}

let AC = null;
function tone(f,d,t=0,type='triangle',vol=.14){
  if (!S.settings.sound) return;
  try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(), at=AC.currentTime+t;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.001,at+d); o.connect(g).connect(AC.destination); o.start(at); o.stop(at+d+.02);
  } catch(e) {}
}
const sDing = () => { tone(988,.14); tone(1319,.3,.08); };
const sOops = () => tone(196,.25,0,'sine',.1);
const sFan = () => { [523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.11)); };
const sCoin = () => tone(1568,.12,0,'square',.05);
function speak(html){
  if (!S.settings.speak || !window.speechSynthesis) return;
  try { const t = html.replace(/<span class="slot"><\/span>/g,' what ').replace(/<span class="frac"><sup>(\d+)<\/sup>&frasl;<sub>(\d+)<\/sub><\/span>/g,' $1 over $2 ').replace(/<sup>(.*?)<\/sup>/g,' to the power of $1 ').replace(/<[^>]+>/g,' ')
      .replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/√/g,' square root of ');
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.95; speechSynthesis.speak(u);
  } catch(e) {}
}

/* ---------- play ---------- */
let R = null;
function startRound(gid, level){
  curTopic = topicOf(gid) || curTopic;
  if (gid==='balloon' || gid==='sballoon' || gid==='fballoon') return startBalloon(gid, level);
  if (IX[gid]) return startIx(gid, level);
  if (gid==='builder') return startBuild(level);
  const kinds = shuffle(bankFor(G[gid],level)), qs=[], keys=new Set(); let i=0, tries=0;
  while (qs.length<6 && tries<300){ tries++; const q=kinds[i%kinds.length](); i++; if (keys.has(q.key)) continue; keys.add(q.key); qs.push(q); }
  R = {gid, level, qs, i:0, first:0, earned:0, mischief:ri(1,4)};
  const g = ALL_GAMES.find(x=>x.id===gid);
  $('#qTitle').textContent = g.name;
  setTag($('#lvlTag'), level);
  $('#playNiff').innerHTML = niffSVG(S.fur,S.wear);
  show('play'); renderQ();
}
function renderDots(){ $('#dots').innerHTML = R.qs.map((_,k)=>`<span class="dot${k<R.i?' done':''}${k===R.i?' now':''}"></span>`).join(''); }
function renderQ(){
  const q=R.qs[R.i]; Object.assign(R,{att:0,hints:0,done:false,input:''});
  $('#qPrompt').innerHTML=q.prompt; $('#qFig').innerHTML=q.fig||''; $('#qFeedback').innerHTML=''; $('#hintList').innerHTML='';
  $('#nextBtn').hidden=true; $('#hintBtn').hidden=!S.settings.hints; $('#hintBtn').disabled=false;
  $('#playBubble').innerHTML = R.i===0 ? `Let's dig! ${R.level==='mm'?'Master Mind! Only the sharpest minds crack these.':R.level==='adv'?'Advanced treasure is extra shiny.':'Six shinies to find.'}` : pick(THINK);
  renderDots();
  if (q.type==='mcq'){
    R.order = shuffle(q.options.map((_,k)=>k));
    $('#qAnswer').innerHTML = `<div class="opts">${R.order.map(k=>`<button class="opt${q.small?' small':''}" data-opt="${k}">${q.options[k]}</button>`).join('')}</div>`;
  } else if (q.frac) {
    R.fin={w:'',n:'',d:'',f:'n'};
    $('#qAnswer').innerHTML = `<div class="fin"><button class="fbox w" data-ff="w" aria-label="whole number"></button><span class="fstack"><button class="fbox" data-ff="n" aria-label="top number"></button><span class="fbar"></span><button class="fbox" data-ff="d" aria-label="bottom number"></button></span></div><p class="dim fin-tip">Tap a box, then type. Leave the big box empty if there is no whole number.</p><div class="pad" id="pad">${['7','8','9','4','5','6','1','2','3','next','0','⌫'].map(k=>`<button class="key" data-key="${k}" aria-label="${k==='⌫'?'delete':k==='next'?'next box':k}">${k==='next'?'⇥':k}</button>`).join('')}<button class="key check" data-key="ok">Check</button></div>`;
    updFrac();
  } else {
    const slot = q.prompt.includes('class="slot"');
    $('#qAnswer').innerHTML = `${slot?'':'<div class="display" id="disp" aria-live="polite">?</div>'}<div class="pad" id="pad">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button class="key" data-key="${k}" aria-label="${k==='⌫'?'delete':k}">${k}</button>`).join('')}<button class="key check" data-key="ok">Check</button></div>`;
    updInput();
  }
  speak(q.prompt);
}
function updInput(){
  const v = R.input || '?';
  $$('#qPrompt .slot').forEach(s=>{ s.textContent=v; s.classList.toggle('filled',!!R.input); });
  const d=$('#disp'); if (d) d.textContent=v;
}
function padKey(k){
  if (!R || R.done) return; const q=R.qs[R.i]; if (q.type!=='pad') return;
  if (q.frac) return fracKey(k);
  if (k==='ok') return checkPad();
  if (k==='⌫') R.input=R.input.slice(0,-1);
  else if (k==='.') { if (!R.input.includes('.') && R.input.length<12) R.input = (R.input||'0')+'.'; }
  else if (R.input.length<12) R.input = (R.input==='0'?'':R.input)+k;
  updInput();
}
function checkPad(){
  const q=R.qs[R.i]; if (R.input==='' || R.input==='.') return;
  const v=parseFloat(R.input); if (Math.abs(v-q.answer)<1e-9) correct(); else wrong();
}
function chooseOpt(btn){
  if (!R || R.done || btn.disabled) return; const k=+btn.dataset.opt;
  if (k===0){ btn.classList.add('right'); correct(); } else { btn.classList.add('wrong'); btn.disabled=true; wrong(); }
}
function correct(){
  const q=R.qs[R.i]; R.done=true;
  const clean = R.att===0 && R.hints===0;
  let c = lvlCoins(clean); if (clean) R.first++;
  const niff=$('#playNiff'); let extra='';
  if (R.i===R.mischief){
    extra = `<div class="mischief">Niffler swiped your ${plural(c,'coin')} and dashed into a tunnel… then came back with ${c*2}! Sneaky.</div>`;
    c*=2; anim(niff,'swipe'); $('#playBubble').innerHTML='Hee hee! Did you see that? I brought friends.';
  } else { anim(niff,'hop'); $('#playBubble').innerHTML = pick(CHEERS); }
  S.coins+=c; R.earned+=c; save();
  setTimeout(()=>{ coinsUI(); flyCoins(niff,c); }, R.i===R.mischief?1300:150);
  sDing();
  const cheer=pick(CHEERS);
  $('#qFeedback').innerHTML = `<span class="good">${cheer}</span> <span>+${plural(c,'coin')}</span><div class="explain">${q.explain}</div>${extra}`;
  speak(cheer);
  finishQ(q);
}
function wrong(){
  const q=R.qs[R.i]; R.att++; sOops(); anim($('#playNiff'),'tilt');
  if (q.type==='pad'){ if (q.frac){ R.fin={w:'',n:'',d:'',f:'n'}; updFrac(); } else { R.input=''; updInput(); } }
  if (R.att>=3){
    R.done=true;
    const ans = q.type==='mcq' ? q.options[0] : q.frac ? fh(...q.answer) : fmt(q.answer);
    $('#qFeedback').innerHTML = `<span>That one was tricky. The answer is <b>${ans}</b>.</span><div class="explain">${q.explain}</div>`;
    $('#playBubble').innerHTML = "Tricky tunnels are the best ones. Let's keep digging!";
    if (q.type==='mcq') $$('.opt').forEach(b=>{ if (+b.dataset.opt===0) b.classList.add('right'); });
    finishQ(q, true);
    return;
  }
  $('#qFeedback').innerHTML = `<span class="oops">${pick(OOPS)}</span>`;
  $('#playBubble').innerHTML = R.att===2 ? 'Here, have a hint. On the house!' : 'Hmm, my nose says no. Try again!';
  if (R.att===2 && S.settings.hints && R.hints < q.hints.length) showHint();
}
function finishQ(q, reveal){
  if (q.type==='pad'){ const p=$('#pad'); if (p) p.classList.add('off'); if (reveal){ if (q.frac){ const [n,d]=q.answer, w=Math.floor(n/d), r=n-w*d; R.fin={w:w?String(w):'',n:r?String(r):'',d:r?String(d):'',f:''}; updFrac(); } else { R.input=String(q.answer); updInput(); } } }
  else $$('.opt').forEach(b=>b.disabled=true);
  $('#hintBtn').hidden=true; $('#nextBtn').hidden=false; $('#nextBtn').textContent = R.i===R.qs.length-1 ? 'Finish round →' : 'Next →';
  R.i++; renderDots(); R.i--;
}
function showHint(){
  const q=R.qs[R.i]; if (R.done || R.hints>=q.hints.length) return;
  R.hints++; const li=document.createElement('li'); li.innerHTML=q.hints[R.hints-1]; $('#hintList').appendChild(li);
  if (R.hints>=q.hints.length) $('#hintBtn').disabled=true;
  speak(q.hints[R.hints-1]);
}
function next(){ R.i++; if (R.i>=R.qs.length) endRound(); else renderQ(); }

/* ---------- Balloon Pop ---------- */
const others = (ans, cands, n=4) => { const out=[]; for (const c of shuffle(cands)){ const v=String(c); if (v!==String(ans) && !out.includes(v)) out.push(v); if (out.length>=n) break; } return out; };
const BAL = { balloon:{ basic:[
  () => { const [a,b]=pick([[2,2],[2,3],[2,4],[3,2],[3,3],[4,2],[5,2],[6,2],[10,2],[2,5]]), v=a**b;

const BMAX=6;
let BS=null;
function solveBuild(task, avoid=[]){ for (let a=1;a<=BMAX;a++) for (let b=1;b<=BMAX;b++) for (let c=1;c<=BMAX;c++){ const k=[a,b,c].sort().join(); if (task.test(a,b,c) && !avoid.includes(k)) return [a,b,c]; } return [2,2,2]; }
function startBuild(level){
  const kinds=shuffle(bankFor(BUILD,level)), qs=[], keys=new Set(); let i=0, tries=0;
  while (qs.length<6 && tries<300){ tries++; const q=kinds[i%kinds.length](); i++; if (keys.has(q.key)) continue; keys.add(q.key); qs.push(q); }
  R = {gid:'builder', level, qs, i:0, first:0, earned:0, mischief:ri(1,4)};
  setTag($('#buildLvl'), level);
  $('#buildNiff').innerHTML = niffSVG(S.fur,S.wear);
  show('build'); setupBuild();
}
function setupBuild(){
  const q=R.qs[R.i]; Object.assign(R,{att:0,done:false}); BS={l:2,w:2,h:2,found:[]};
  $('#buildAsk').innerHTML=q.ask; $('#buildSub').textContent=q.sub; $('#buildFeedback').innerHTML=''; $('#buildFound').innerHTML='';

  $('#buildDots').innerHTML = R.qs.map((_,k)=>`<span class="dot${k<R.i?' done':''}${k===R.i?' now':''}"></span>`).join('');

}
function drawBuild(showV){
  const {l,w,h}=BS;
  $('#buildFig').innerHTML = isoScene([{x:0,y:0,z:0,l,w,h,color:'blue'}],{frame:{l:BMAX,w:BMAX,h:BMAX},labels:boxLabels(l,w,h,[String(l),String(w),String(h)]),width:380,height:360,maxU:30,maxW:460,aria:`box ${l} by ${w} by ${h}`});
  ['l','w','h'].forEach(d=>{ $('#dim-'+d).textContent=BS[d]; });
  $$('.sbtn').forEach(b=>{ const v=BS[b.dataset.dim]+Number(b.dataset.d); b.disabled = R.done || v<1 || v>BMAX; });
  const sq=R&&R.qs&&R.qs[R.i]; $('#buildRead').innerHTML = `${l} × ${w} × ${h} = ${showV?`<b>${l*w*h}</b>`:'?'} cubes${sq&&sq.sa?` · surface ${showV?`<b>${2*(l*w+w*h+l*h)}</b>`:'?'}`:''}`;
}
function stepDim(d,delta){ if (!R || R.done) return; const v=BS[d]+delta; if (v<1||v>BMAX) return; BS[d]=v; tone(380+v*60,.06,0,'sine',.08); drawBuild(); }
function checkBuild(){
  if (!R || R.done) return; const q=R.qs[R.i], {l,w,h}=BS, V=l*w*h, key=[l,w,h].sort().join();
  drawBuild(true);
  if (q.test(l,w,h)){
    if (q.need && BS.found.includes(key)){ $('#buildFeedback').innerHTML='<span class="oops">You already built that one. Turning it around does not count. Try a different shape!</span>'; return; }
    BS.found.push(key);
    if (q.need && BS.found.length<q.need){ sDing(); anim($('#buildNiff'),'hop');
      $('#buildFound').innerHTML = BS.found.map(k=>`<span class="chip">${k.split(',').join(' × ')}</span>`).join('');
      $('#buildFeedback').innerHTML=`<span class="good">${BS.found.length===1?'One found!':'Two found!'}</span> ${l} × ${w} × ${h} = ${V}. Now build another <b>different</b> box.`; return; }
    R.done=true; const clean=R.att===0; let c=lvlCoins(clean); if (clean) R.first++;
    let extra=''; if (R.i===R.mischief){ extra=` <span class="dim">Niffler hid inside your box and popped out with ${c*2} coins instead of ${c}!</span>`; c*=2; }

    $('#buildBubble').innerHTML=pick(CHEERS);
    if (q.need) $('#buildFound').innerHTML = BS.found.map(k=>`<span class="chip">${k.split(',').join(' × ')}</span>`).join('');
    $('#buildFeedback').innerHTML=`<span class="good">${pick(CHEERS)}</span> +${plural(c,'coin')}. Your box: ${l} × ${w} × ${h} = ${V} cubes.${extra}`;

  } else {
    R.att++; sOops(); anim($('#buildNiff'),'tilt');

    $('#buildBubble').innerHTML = R.att===1 ? 'Close! Change a number and try again.' : 'Here is a hint below. You can do it!';
  }
}

    return {key:'fq5'+set.join('|'), ask:'Pop the smallest fraction', sub:'Compare each one with 1/2, or use a common denominator.', answer:fr(...small), others:set.filter(f=>f!==small).map(f=>fr(...f)), explain:set.map(f=>`${fr(...f)} ≈ ${(f[0]/f[1]).toFixed(2)}`).join(', ')+'.'}; },

/* ---------- interactive engine (Pie Cutter, Fraction Wall, Number Line Leap) ---------- */
let IS = null;
const IX = {};
function startIx(gid, level){
  const kinds=shuffle(bankFor(IX[gid].bank,level)), qs=[], keys=new Set(); let i=0, tries=0;
  while (qs.length<6 && tries<300){ tries++; const q=kinds[i%kinds.length](); i++; if (keys.has(q.key)) continue; keys.add(q.key); qs.push(q); }
  R = {gid, level, qs, i:0, first:0, earned:0, mischief:ri(1,4)};
  $('#ixTitle').textContent = ALL_GAMES.find(g=>g.id===gid).name;
  setTag($('#ixLvl'), level);
  $('#ixNiff').innerHTML = niffSVG(S.fur,S.wear);
  show('ix'); setupIx();
}
function ixDots(done){ $('#ixDots').innerHTML = R.qs.map((_,k)=>`<span class="dot${k<R.i||(done&&k===R.i)?' done':''}${k===R.i&&!done?' now':''}"></span>`).join(''); }
function setupIx(){
  const q=R.qs[R.i]; Object.assign(R,{att:0,done:false});
  $('#ixAsk').innerHTML=q.ask; $('#ixSub').textContent=q.sub; $('#ixFeedback').innerHTML='';
  $('#ixBubble').innerHTML = R.i===0 ? IX[R.gid].intro : pick(THINK);
  $('#ixNext').hidden=true; $('#ixCheck').hidden=false; $('#ixStage').classList.toggle('drag', R.gid==='line');
  ixDots(); IX[R.gid].init(q); speak(q.ask);
}
function ixAct(a,v){ if (!R || R.done || !IX[R.gid]) return; IX[R.gid].act(a,v,R.qs[R.i]); }
function checkIx(){
  if (!R || R.done) return; const q=R.qs[R.i], X=IX[R.gid], res=X.test(q);
  if (res===true){
    R.done=true; const clean=R.att===0; let c=lvlCoins(clean); if (clean) R.first++;
    let extra=''; if (R.i===R.mischief){ extra=` <span class="dim">Niffler snatched your ${plural(c,'coin')} and came back with ${c*2}!</span>`; c*=2; }
    S.coins+=c; R.earned+=c; save(); coinsUI(); flyCoins($('#ixNiff'),c); sDing(); anim($('#ixNiff'),'hop');
    $('#ixBubble').innerHTML=pick(CHEERS);
    $('#ixFeedback').innerHTML=`<span class="good">${pick(CHEERS)}</span> +${plural(c,'coin')}. ${X.describe(q)}${extra}`;
    finishIx(); return;
  }
  if (typeof res==='string'){ $('#ixFeedback').innerHTML=`<span class="oops">${res}</span>`; return; }
  R.att++; sOops(); anim($('#ixNiff'),'tilt');
  if (R.att>=3){ X.solve(q); R.done=true; X.render(q); $('#ixFeedback').innerHTML=`Tricky one! Here is one way to do it. ${X.describe(q)}`; $('#ixBubble').innerHTML='Every explorer needs a peek sometimes.'; finishIx(); return; }
  $('#ixFeedback').innerHTML=`<span class="oops">Not quite.</span> ${X.describe(q)} ${q.hint}`;
  $('#ixBubble').innerHTML = R.att===1 ? 'Close! Change something and try again.' : 'Read the hint below. You can do it!';
}
function finishIx(){ $('#ixCheck').hidden=true; $('#ixNext').hidden=false; $('#ixNext').textContent = R.i===R.qs.length-1 ? 'Finish round →' : 'Next →'; ixDots(true); IX[R.gid].render(R.qs[R.i]); }
function nextIx(){ R.i++; if (R.i>=R.qs.length) endRound(); else setupIx(); }
const stepperHTML = (label, act, val, lo, hi) => `<div class="stepper"><span class="slabel">${label}</span><button class="sbtn" data-ix="${act}" data-v="-1" ${R.done||val<=lo?'disabled':''} aria-label="fewer">−</button><b>${val}</b><button class="sbtn" data-ix="${act}" data-v="1" ${R.done||val>=hi?'disabled':''} aria-label="more">+</button></div>`;

/* Pie Cutter */
IX.pie = { intro:'Tap slices to shade them. Use + and − to cut more or fewer slices.', bank:{ basic:[
  () => { const [n,d]=pick([[3,4],[2,3],[1,2],[3,8],[5,6],[2,5],[3,5]]); return {key:'pa'+n+d, ask:`Shade ${fr(n,d)} of the pie.`, sub:'Tap slices to shade them.', k0:d, lock:true, test:(k,s)=>s===n, sol:[d,n], hint:`The pie has ${d} slices. Shade ${n} of them.`}; },
  () => { const [n,d,m]=pick([[3,4,2],[1,2,3],[2,3,2],[1,3,3],[1,2,4],[3,4,3]]), K=d*m; return {key:'pb'+n+d+m, ask:`Show ${fr(n,d)} using <b>${K} slices</b>.`, sub:'Cut the pie into more slices, then shade.', k0:d, lock:false, test:(k,s)=>k===K&&s===n*m, sol:[K,n*m], hint:`Cut into ${K} slices. Each ${fr(1,d)} becomes ${m} slices.`}; },
  () => { const [n,d]=pick([[2,5],[3,4],[1,3],[4,6],[5,8]]); return {key:'pc'+n+d, ask:`Cut the pie and shade ${fr(n,d)}.`, sub:'You choose how many slices.', k0:1, lock:false, test:(k,s)=>s*d===n*k, sol:[d,n], hint:`Cut the pie into ${d} equal slices first.`}; },
  () => { const [n,d]=pick([[1,4],[3,8],[2,6],[1,3]]); return {key:'pd'+n+d, ask:`Niffler ate ${fr(n,d)} of the pie. Shade the part that is <b>left</b>.`, sub:'Left over = the whole pie minus what was eaten.', k0:d, lock:true, test:(k,s)=>s===d-n, sol:[d,d-n], hint:`1 whole = ${fr(d,d)}. Take away ${fr(n,d)}.`}; },
], adv:[
  () => { const [n,d,K]=pick([[2,3,12],[3,4,12],[5,6,12],[3,5,10],[1,4,8]]); return {key:'qa'+n+d+K, ask:`Shade ${fr(n,d)} using exactly <b>${K} slices</b>.`, sub:'Cut first, then shade.', k0:1, lock:false, test:(k,s)=>k===K&&s*d===n*K, sol:[K,n*K/d], hint:`Each ${fr(1,d)} is ${K/d} of the ${K} slices.`}; },
  () => { const [n,d]=pick([[5,10],[6,8],[4,12],[9,12],[6,10],[8,12]]), [a,b]=simp(n,d); return {key:'qb'+n+d, ask:`Shade a fraction equal to ${fr(n,d)} using as <b>few slices</b> as you can.`, sub:'Simplify first.', k0:d, lock:false, test:(k,s)=>k===b&&s===a, sol:[b,a], hint:`Find a number that divides both ${n} and ${d}.`}; },
  () => { const [a,b,c,d]=pick([[3,4,2,3],[1,2,2,3],[2,3,3,4],[1,2,1,2],[1,3,3,4]]), p=simp(a*c,b*d); return {key:'qc'+a+b+c+d, ask:`Niffler gets ${fr(c,d)} of the pie and eats ${fr(a,b)} of its share. Shade what Niffler ate.`, sub:`That is ${fr(a,b)} × ${fr(c,d)}.`, k0:1, lock:false, test:(k,s)=>s*p[1]===p[0]*k&&s>0, sol:[p[1],p[0]], hint:`${fr(a,b)} × ${fr(c,d)} = ${fr(a*c,b*d)}. Simplify it, then cut and shade.`}; },
  () => { const [a,b]=pick([[[1,2],[1,3]],[[1,4],[1,2]],[[1,3],[1,6]],[[1,4],[1,3]],[[1,6],[1,2]]]), s=fadd(a,b); return {key:'qd'+a+b, ask:`Shade ${fr(...a)} + ${fr(...b)}.`, sub:'Pick a number of slices that works for both.', k0:1, lock:false, test:(k,sh)=>sh*s[1]===s[0]*k, sol:[s[1],s[0]], hint:`Try ${s[1]} slices: ${fr(...a)} = ${fr(a[0]*s[1]/a[1],s[1])} and ${fr(...b)} = ${fr(b[0]*s[1]/b[1],s[1])}.`}; },
  () => { const [n,d]=pick([[3,8],[2,5],[5,12],[1,6]]); return {key:'qe'+n+d, ask:`Shade 1 − ${fr(n,d)}.`, sub:'Cut the pie yourself.', k0:1, lock:false, test:(k,s)=>s*d===(d-n)*k, sol:[d,d-n], hint:`Cut into ${d} slices. 1 whole is ${fr(d,d)}.`}; },
]},
  init(q){ IS={k:q.k0, sh:Array(q.k0).fill(false)}; this.render(q); },
  render(q){
    const {k,sh}=IS, cx=160, cy=160, r=140; let s='';
    if (k===1) s=`<circle cx="${cx}" cy="${cy}" r="${r}" class="wedge${sh[0]?' on':''}" data-ix="slice" data-v="0"/>`;
    else for (let i=0;i<k;i++){ const a0=-Math.PI/2+i*2*Math.PI/k, a1=a0+2*Math.PI/k, x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${k===2?0:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" class="wedge${sh[i]?' on':''}" data-ix="slice" data-v="${i}"/>`; }
    $('#ixStage').innerHTML = `<svg class="fig pie" viewBox="0 0 320 320" style="max-width:340px" role="img" aria-label="pie cut into ${k} slices"><circle cx="${cx}" cy="${cy}" r="${r+8}" class="crust"/>${s}</svg>`;
    const n=sh.filter(Boolean).length;

    $('#ixControls').innerHTML = q.lock ? `<p class="dim">This pie is already cut into ${k} slices.</p>` : stepperHTML('Slices','cut',k,1,12) + `<button class="btn" data-ix="clear" ${R.done?'disabled':''}>Unshade all</button>`;

  act(a,v,q){ if (a==='slice'){ IS.sh[+v]=!IS.sh[+v]; tone(IS.sh[+v]?660:440,.06,0,'sine',.08); }

  describe(){ const n=IS.sh.filter(Boolean).length; return `You shaded ${n} of ${IS.k} slices: ${fr(n,IS.k)}${gcd(n,IS.k)>1&&n?` = ${fh(n,IS.k)}`:''}.`; },
  solve(q){ IS.k=q.sol[0]; IS.sh=Array(IS.k).fill(false).map((_,i)=>i<q.sol[1]); },
};

  () => ({key:'wb3', ask:'Fill one whole using <b>exactly 4 bars</b>, all different sizes.', sub:'A tricky one!', pal:[2,3,4,5,6,8,10,12], target:[1,1], rule:p=>(p.length===4&&distinct(p))||'Use exactly 4 bars, all different.', sol:[2,4,6,12], hint:`Try ${fr(1,2)} + ${fr(1,4)} first. What two different bars make ${fr(1,4)}?`}),
  () => { const [n,d]=pick([[2,3],[3,5],[3,4]]); return {key:'wb4'+n+d, ask:`Build ${fr(n,d)}, but <b>do not use</b> any ${fr(1,d)} bars.`, sub:'Find another way to make it.', pal:[2,3,4,5,6,8,10,12].filter(x=>x!==d), target:[n,d], rule:()=>true, sol:{'2/3':[2,6],'3/5':[2,10],'3/4':[2,6,12]}[n+'/'+d], hint:`Start with ${fr(1,2)}. What is left to fill?`}; },

  init(q){ IS={p:[]}; this.render(q); },

function fracKey(k){
  const f=R.fin; if (k==='ok') return checkFrac();
  if (k==='⌫'){ if (f[f.f]) f[f.f]=f[f.f].slice(0,-1); }
  else if (k==='next'){ f.f = f.f==='n'?'d':f.f==='d'?'w':'n'; }
  else if (/^[0-9]$/.test(k) && f[f.f].length<3){ f[f.f]+=k; if (f.f==='n' && f[f.f].length>=String(R.qs[R.i].answer[1]).length && !f.d) {} }
  updFrac();
}
function updFrac(){ const f=R.fin; $$('.fbox').forEach(b=>{ const k=b.dataset.ff; b.textContent=f[k]||''; b.classList.toggle('on', f.f===k); }); }
function checkFrac(){
  const q=R.qs[R.i], f=R.fin; if (!f.w && !f.n){ $('#qFeedback').innerHTML='<span class="oops">Type an answer first.</span>'; return; }
  if (f.n && !f.d && q.answer[1]===1){ f.w=String(+(f.w||0)+(+f.n)); f.n=''; }
  if (f.n && (!f.d || +f.d===0)){ $('#qFeedback').innerHTML='<span class="oops">Fill in the bottom number too.</span>'; f.f='d'; updFrac(); return; }
  const W=+(f.w||0), N=+(f.n||0), D=f.n ? +f.d : 1, [an,ad]=q.answer;
  if ((W*D+N)*ad === an*D){
    if (q.simplest && N && gcd(N,D)>1){ $('#qFeedback').innerHTML='<span class="oops">That is equal! Now write it in simplest form.</span>'; return; }
    correct();
  } else wrong();
}

/* ---------- impressionist painter: re-paints an SVG with brush strokes ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const strHash = s => { let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
const PAINT_CACHE = new Map();
function paintSVG(id, svg){
  if (PAINT_CACHE.has(id)) return PAINT_CACHE.get(id);
  const pr = new Promise(resolve => {
    const N=640, img=new Image();
    img.onload = () => { try {
      const src=document.createElement('canvas'); src.width=src.height=N; const sc=src.getContext('2d'); sc.drawImage(img,0,0,N,N);
      const d=sc.getImageData(0,0,N,N).data;
      const out=document.createElement('canvas'); out.width=out.height=N; const c=out.getContext('2d');
      const tiny=document.createElement('canvas'); tiny.width=tiny.height=48; tiny.getContext('2d').drawImage(img,0,0,48,48);
      c.imageSmoothingEnabled=true; c.drawImage(tiny,0,0,N,N);
      const L=new Float32Array(N*N); for (let i=0;i<N*N;i++) L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
      const rnd=mulberry32(strHash(id)), cl=v=>Math.max(0,Math.min(255,v|0)), ci=v=>Math.max(1,Math.min(N-2,v|0));
      const px=(x,y)=>{ const i=(ci(y)*N+ci(x))*4; return [d[i],d[i+1],d[i+2]]; };
      const grad=(x,y)=>{ x=ci(x); y=ci(y); const gx=(L[y*N+x+1]-L[y*N+x-1])+.5*(L[(y-1)*N+x+1]-L[(y-1)*N+x-1]+L[(y+1)*N+x+1]-L[(y+1)*N+x-1]);
        const gy=(L[(y+1)*N+x]-L[(y-1)*N+x])+.5*(L[(y+1)*N+x-1]-L[(y-1)*N+x-1]+L[(y+1)*N+x+1]-L[(y-1)*N+x+1]); return [gx,gy]; };
      const base=.55+rnd()*.5;
      c.lineCap='round';
      const layer=(step,len,w,minMag,alpha)=>{
        const pts=[]; for (let y=0;y<N;y+=step) for (let x=0;x<N;x+=step) pts.push([x+(rnd()-.5)*step, y+(rnd()-.5)*step]);
        for (let i=pts.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; [pts[i],pts[j]]=[pts[j],pts[i]]; }
        for (const [x,y] of pts){
          const [gx,gy]=grad(x,y), mag=Math.hypot(gx,gy); if (mag<minMag) continue;
          let ang = mag>6 ? Math.atan2(gy,gx)+Math.PI/2 : base+(rnd()-.5)*.9; ang+=(rnd()-.5)*.3;
          const [r,g,b]=px(x,y), k=1+(rnd()-.5)*.2, s=(rnd()-.5)*20, warm=(rnd()-.5)*16, br=rnd()<.12?(rnd()<.5?18:-18):0;
          c.strokeStyle=`rgb(${cl(r*k+s+warm+br)},${cl(g*k+s+br*.4)},${cl(b*k+s-warm-br)})`; c.globalAlpha=alpha;
          const l=len*(.65+rnd()*.7), dx=Math.cos(ang)*l/2, dy=Math.sin(ang)*l/2; c.lineWidth=w*(.7+rnd()*.6);
          c.beginPath(); c.moveTo(x-dx,y-dy); c.quadraticCurveTo(x+(rnd()-.5)*w*1.2, y+(rnd()-.5)*w*1.2, x+dx, y+dy); c.stroke();
        }
      };
      layer(10,40,14,0,.75); layer(6,24,8,0,.8); layer(4,13,4.5,10,.85); layer(2.6,7,2.6,40,.9);
      c.globalAlpha=.05; for (let i=0;i<2600;i++){ c.fillStyle=rnd()<.5?'#fff':'#000'; c.fillRect(rnd()*N, rnd()*N, 2, 2); }
      resolve(out.toDataURL('image/jpeg',.88));
    } catch(e){ resolve(null); } };
    img.onerror=()=>resolve(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg viewBox="0 0 400 400"','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"'));
  });
  PAINT_CACHE.set(id, pr); return pr;
}
function hydratePics(root=document){
  root.querySelectorAll('[data-pic]').forEach(el => {
    const a=ANIMALS.find(x=>x.id===el.dataset.pic); if (!a || el.dataset.done) return; el.dataset.done='1';
    paintSVG(a.id, a.draw()).then(url => { el.innerHTML = url ? `<img class="animal" src="${url}" alt="">` : a.draw(); });
  });
}

/* photo store: stays in this browser on this device */
const PDB = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try { const r=indexedDB.open('niffler-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); } catch(e){ rej(e); } }); },
  tx(mode, fn){ return this.open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('photos',mode), st=t.objectStore('photos'), q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); })); },
  all(){ return this.tx('readonly', st=>st.getAll()).then(r=>(r||[]).sort((a,b)=>a.added-b.added)).catch(()=>[]); },
  put(p){ return this.tx('readwrite', st=>st.put(p)); },
  del(id){ return this.tx('readwrite', st=>st.delete(id)); },
};
function loadPhotos(){ return PDB.all().then(r=>{ PHOTOS=r; return r; }); }
function shrinkImage(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error('not an image')); im.onload=()=>{ const M=1200, sc=Math.min(1, M/Math.max(im.width,im.height)), cv=document.createElement('canvas');
    cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',.85)); }; im.src=fr.result; };
  fr.readAsDataURL(file); }); }

/* the two puzzle kinds share one engine */
function pzState(kind){
  const key = kind==='animals' ? 'gallery' : 'travel';
  if (!S[key] || typeof S[key]!=='object') S[key] = clone(DEFAULT[key]);
  return S[key];
}
function pzItem(kind){
  const st=pzState(kind);
  if (kind==='animals'){ const a=ANIMALS[st.cur]; return a ? {id:a.id, name:a.name, fact:a.fact, pic:`<div class="pic" data-pic="${a.id}"></div>`} : null; }
  let p = PHOTOS.find(x=>x.id===st.cur && !st.done.some(d=>d.id===x.id));
  if (!p && st.reveal) p = PHOTOS.find(x=>x.id===st.cur);
  if (!p){ p = PHOTOS.find(x=>!st.done.some(d=>d.id===x.id)); if (p && st.cur!==p.id){ st.cur=p.id; st.choices=[]; } }
  return p ? {id:p.id, name:p.place, fact:p.note, pic:`<img class="animal photo" src="${p.img}" alt="">`} : null;
}
function pzEnsure(kind){
  const st=pzState(kind), it=pzItem(kind); if (!it) return;
  if (!st.choices || st.choices.length<2 || !st.choices.includes(it.name)){
    let pool;
    if (kind==='animals'){ const a=ANIMALS[st.cur]; pool=[...shuffle(a.similar).slice(0,6), ...shuffle(MORE_NAMES.filter(n=>!a.similar.includes(n))).slice(0,3)]; }
    else { const low=it.name.trim().toLowerCase(), mine=shuffle([...new Set(PHOTOS.map(p=>p.place))].filter(n=>n.trim().toLowerCase()!==low)).slice(0,4);
      pool=[...mine, ...shuffle(WORLD_PLACES.filter(n=>n.toLowerCase()!==low && !mine.includes(n)))].slice(0,9); }
    st.choices=shuffle([it.name, ...pool]); st.tiles=Array(16).fill(false); st.wrong=[]; st.reveal=false; save();
  }
}
function renderGallery(){
  const kind=galTab, st=pzState(kind); pzEnsure(kind); const it=pzItem(kind), open=it?st.tiles.filter(Boolean).length:0;

  const pos = kind==='animals' ? st.cur+1 : st.done.length + (st.reveal?0:1);

    main = kind==='animals'
      ? `<div class="vstory"><div><span class="kicker">All found!</span><h2>You uncovered every mystery animal.</h2><p class="dim" style="margin-top:8px">New pictures are on their way. Try Where in the World?</p></div></div>`

          <button class="btn gold" id="galNext">Next ${isA?'mystery picture':'photo'} →</button>`
        : `<h2>${isA?'Who is hiding?':'Where in the world is this?'}</h2>

          <div class="guess">${st.choices.map(n=>`<button class="gbtn${st.wrong.includes(n)?' no':''}" data-guess="${esc(n)}" ${st.wrong.includes(n)||!open?'disabled':''}>${esc(n)}</button>`).join('')}</div>`}

const VAULT = {
  clues:[
    {q:'Start in the morning and go backwards. Just before Niffler grabbed the 2 lucky cookies, how many cookies were there?', a:6, ex:'4 were left after taking 2, so there were 4 + 2 = 6.'},
    {q:'Those 6 cookies were the half that Niffler did <b>not</b> eat on night 3. How many cookies were there at the start of night 3?', a:12, ex:'6 is half, so the whole was 6 × 2 = 12.'},
    {q:`On night 2 Niffler ate ${fr(1,4)}, so ${fr(3,4)} were left, and that was 12 cookies. How many were there at the start of night 2?`, a:16, ex:`${fr(3,4)} is 12, so ${fr(1,4)} is 4, and the whole is 16.`},
  ],
  answer:24, bonus:48,
};
function vaultSim(n, target){
  if (!Number.isInteger(n) || n<=0) return {ok:false, txt:'Try a whole number of cookies.'};
  const L=[]; let x=n;
  if (x%3) return {ok:false, txt:`Let's test ${n}: on night 1 Niffler eats ${fr(1,3)} of ${n} cookies, but ${n} can't be split into 3 equal parts. Niffler never breaks a cookie, so ${n} can't be right.`};
  L.push(`Night 1: eats ${x/3}, leaving ${x-x/3}.`); x-=x/3;
  if (x%4) return {ok:false, txt:`Let's test ${n}: ${L.join(' ')} On night 2 Niffler eats ${fr(1,4)} of ${x}, which isn't a whole number of cookies. So ${n} can't be right.`};
  L.push(`Night 2: eats ${x/4}, leaving ${x-x/4}.`); x-=x/4;
  if (x%2) return {ok:false, txt:`Let's test ${n}: ${L.join(' ')} On night 3 Niffler eats half of ${x}, which would break a cookie. So ${n} can't be right.`};
  const h=x/2; x=h-2; L.push(`Night 3: eats half (${h}), then 2 more, leaving ${x}.`);
  if (x===target) return {ok:true, txt:L.join(' ')};
  return {ok:false, txt:`Let's test ${n}: ${L.join(' ')} That leaves ${x} in the morning, not ${target}. Try a ${x>target?'smaller':'bigger'} number.`};
}

G.double.mm = [
