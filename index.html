  () => ({key:'wm5', ask:`Build ${fr(9,10)} with exactly <b>3 different</b> bars.`, sub:'No size twice.', pal:MM_PAL, target:[9,10], rule:p=>(p.length===3&&distinct(p))||'Use exactly 3 bars, all different.', sol:[2,3,15], hint:`${fr(1,2)} + ${fr(1,3)} = ${fr(5,6)}. How much more makes ${fr(9,10)}?`}),
];
IX.line.bank.mm = [
  () => ({key:'lm1', ask:`Land on ${fr(2,3)} of ${fr(3,4)}.`, sub:'The ticks are twelfths.', max:1, d:12, target:[1,2], hint:`${fr(2,3)} × ${fr(3,4)} = ${fr(6,12)}.`}),
  () => ({key:'lm2', ask:`Land on 1${fr(1,3)} − ${fr(5,6)}.`, sub:'The ticks are sixths.', max:2, d:6, target:[1,2], hint:`1${fr(1,3)} = ${fr(8,6)}.`}),
  () => ({key:'lm3', ask:`Land on the point ${fr(3,4)} of the way from ${fr(1,2)} to 2.`, sub:'The ticks are eighths.', max:2, d:8, target:[13,8], hint:`From ${fr(1,2)} to 2 is 1${fr(1,2)}. ${fr(3,4)} of that is ${fr(9,8)}.`}),
  () => ({key:'lm4', ask:`Land exactly halfway between ${fr(2,3)} and ${fr(3,4)}.`, sub:'The ticks are 24ths. Look closely!', max:1, d:24, target:[17,24], hint:`${fr(2,3)} = ${fr(16,24)} and ${fr(3,4)} = ${fr(18,24)}.`}),
  () => ({key:'lm5', ask:`Land on ${fr(1,2)} + ${fr(1,4)} + ${fr(1,8)} + ${fr(1,16)}.`, sub:'The ticks are sixteenths.', max:1, d:16, target:[15,16], hint:'Each step fills half of the gap that is left.'}),
  () => ({key:'lm6', ask:`Land on 5 ÷ 4 − ${fr(1,3)}.`, sub:'The ticks are twelfths.', max:2, d:12, target:[11,12], hint:`5 ÷ 4 = ${fr(15,12)}.`}),
];

/* ---------- end of round ---------- */
function endRound(){
  const {gid, level, first, earned} = R;
  S.stats[gid] = S.stats[gid] || {};
  const st = S.stats[gid][level] || {rounds:0, best:0, firstTotal:0};
  st.rounds++; st.best=Math.max(st.best,first); st.firstTotal=(st.firstTotal||0)+first; S.stats[gid][level]=st;
  const rare = level!=='basic' ? '1' : '0';
  const left = ALL_SHINIES.filter(id => id.endsWith('-'+rare) && !S.shinies.includes(id));
  let shiny=null, bonus=0;
  if (left.length){ shiny=pick(left); S.shinies.push(shiny); } else { bonus=10; S.coins+=bonus; }
  let wonder=null;
  if (level!=='basic' && !S.wonders.includes(gid)){ S.wonders.push(gid); wonder=WONDERS[gid]; }
  save(); coinsUI(); sFan(); coinRain();
  const g=ALL_GAMES.find(x=>x.id===gid), others3 = LEVELS.filter(l=>l!==level);
  $('#scr-end').innerHTML = `
  <div class="end">
    <div class="niff hop" id="endNiff">${niffSVG(S.fur,S.wear)}</div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <span class="kicker">${g.name} · ${LVL[level].name}</span>
      <h1>${first>=5?'Treasure master!':first>=3?'What a haul!':'Round complete!'}</h1>
      <div class="stats"><div class="stat"><b>${first}/6</b>right first try</div><div class="stat"><b>+${earned+bonus}</b>coins</div></div>
      ${shiny ? `<div class="found">${shinySVG(shiny)}<div><span class="kicker">New shiny for the hoard</span><h3>${shinyName(shiny)}</h3><span class="dim">${S.shinies.length} of ${ALL_SHINIES.length} found</span></div></div>`
              : `<div class="found"><div><span class="kicker">Hoard full!</span><h3>Niffler found 10 bonus coins instead</h3></div></div>`}
      ${wonder ? `<div class="wonder"><span class="kicker">New Wonder Card</span><p>${wonder}</p></div>` : ''}
      <div class="end-actions">
        <button class="btn gold" data-play="${gid}" data-level="${level}">Play again</button>
        ${others3.map(l=>`<button class="btn ${l==='adv'?'deep':l==='mm'?'mm':''}" data-play="${gid}" data-level="${l}">Try ${LVL[l].name}</button>`).join('')}
        <button class="btn" data-topic="${topicOf(gid)}">Back to the tunnel</button>
      </div>
    </div>
  </div>`;
  show('end');
  speak(`Round complete! ${first} out of 6 right first try.`);
}

/* ---------- hoard ---------- */
function renderHoard(){
  $('#scr-hoard').innerHTML = `
  <div class="hoard-top">
    <div class="hoard-niff"><div class="niff" id="hoardNiff">${niffSVG(S.fur,S.wear)}</div><h3>${esc(S.name)}</h3></div>
    <div style="min-width:0">
      <span class="kicker">The Hoard Room</span>
      <h1>Dress up ${esc(S.name)}</h1>
      <p class="dim" style="margin-top:8px">Spend coins on outfits. Tap something you own to put it on or take it off. Coins are never lost. Out of things to buy? Uncover mystery animals in the <button class="linkbtn" data-go="gallery" style="padding:0">Gallery</button>.</p>
      <div class="section-title"><h3>Outfits</h3></div>
      <div class="shop">${ITEMS.map(it => { const own=S.owned.includes(it.id), on=S.wear[it.slot]===it.id;
        return `<button class="item${on?' on':''}" data-item="${it.id}"><b>${it.name}</b><span class="dim">${on?'Wearing':own?'Tap to wear':''}</span>${own?'':`<span class="cost"><span class="coin-ico"></span>${it.cost}</span>`}</button>`; }).join('')}</div>
      <div class="section-title"><h3>Fur colour</h3></div>
      <div class="shop">${Object.entries(FURS).map(([id,f]) => { const own=S.furs.includes(id), on=S.fur===id;
        return `<button class="item${on?' on':''}" data-fur="${id}"><span class="swatch" style="background:${f.main}"></span><b>${f.n}</b>${own?`<span class="dim">${on?'Wearing':'Tap to wear'}</span>`:`<span class="cost"><span class="coin-ico"></span>${f.cost}</span>`}</button>`; }).join('')}</div>
      <p class="feedback" id="shopMsg" aria-live="polite"></p>
    </div>
  </div>
  <div class="section-title"><h2>Shiny collection</h2><span class="dim">${S.shinies.length} of ${ALL_SHINIES.length} found. Basic rounds find shinies; Advanced and Master Mind rounds find glowing ones.</span></div>
  <div class="shelf">${ALL_SHINIES.map(id => S.shinies.includes(id) ? `<div class="cell" title="${shinyName(id)}">${shinySVG(id)}</div>` : '<div class="cell empty"></div>').join('')}</div>
  <div class="section-title"><h2>Wonder Cards</h2><span class="dim">Finish an Advanced round in each game to collect them all.</span></div>
  <div class="wonders">${ALL_GAMES.map(g => S.wonders.includes(g.id)
    ? `<div class="wonder"><span class="kicker">${g.name}</span><p>${WONDERS[g.id]}</p></div>`
    : `<div class="wonder locked"><span class="kicker">${g.name} · ${TOPIC_META[topicOf(g.id)].title}</span><p>Finish an Advanced round to reveal this card.</p></div>`).join('')}</div>`;
}
function buyItem(id){
  const it=ITEMS.find(x=>x.id===id); const msg=$('#shopMsg');
  if (!S.owned.includes(id)){
    if (S.coins<it.cost){ msg.innerHTML=`<span class="oops">You need ${it.cost-S.coins} more coins for the ${it.name}.</span>`; return; }
    S.coins-=it.cost; S.owned.push(id); S.wear[it.slot]=id; sFan();
  } else S.wear[it.slot] = S.wear[it.slot]===id ? null : id;
  save(); coinsUI(); renderHoard(); anim($('#hoardNiff'),'hop');
}
function buyFur(id){
  const f=FURS[id];
  if (!S.furs.includes(id)){
    if (S.coins<f.cost){ $('#shopMsg').innerHTML=`<span class="oops">You need ${f.cost-S.coins} more coins for ${f.n} fur.</span>`; return; }
    S.coins-=f.cost; S.furs.push(id); sFan();
  }
  S.fur=id; save(); coinsUI(); renderHoard(); anim($('#hoardNiff'),'wiggle');
}

/* ---------- grown-ups ---------- */
let resetArmed=false;
function renderGrown(){
  const rows = ALL_GAMES.map(g => { const b=stat(g.id,'basic'), a=stat(g.id,'adv'), m=stat(g.id,'mm');
    const pct = s => s.rounds ? Math.round(100*(s.firstTotal||0)/(6*s.rounds))+'%' : '–';
    return `<tr><td>${TOPIC_META[topicOf(g.id)].title.replace('The ','')}: ${g.name}</td><td>${b.rounds}</td><td>${pct(b)}</td><td>${a.rounds}</td><td>${pct(a)}</td><td>${m.rounds}</td><td>${pct(m)}</td></tr>`; }).join('');
  $('#scr-grown').innerHTML = `
  <div class="topic-head"><span class="kicker">For grown-ups</span><h1>Settings and progress</h1><p class="dim">Progress is saved in this browser on this device only.</p></div>
  <div class="form">
    <div class="field"><label for="setPlayer">Player name</label><input type="text" id="setPlayer" value="${esc(S.player)}" maxlength="20"></div>
    <div class="field"><label for="setName">Creature's name</label><input type="text" id="setName" value="${esc(S.name)}" maxlength="20"></div>
    <label class="toggle"><input type="checkbox" id="setSound" ${S.settings.sound?'checked':''}> Sound effects</label>
    <label class="toggle"><input type="checkbox" id="setSpeak" ${S.settings.speak?'checked':''}> Read questions and cheers out loud</label>
    <label class="toggle"><input type="checkbox" id="setHints" ${S.settings.hints?'checked':''}> Show the Hint button</label>
  </div>
  <div class="section-title"><h2>Progress by game</h2></div>
  <div class="tablewrap"><table><thead><tr><th>Game</th><th>Basic rounds</th><th>Basic first-try</th><th>Advanced rounds</th><th>Advanced first-try</th><th>Master Mind rounds</th><th>Master Mind first-try</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="dim" style="margin-top:12px">Coins: ${fmt(S.coins)} · Shinies: ${S.shinies.length} of ${ALL_SHINIES.length} · Wonder Cards: ${S.wonders.length} of ${ALL_GAMES.length}</p>
  <div id="photoMgr">${photoManagerHTML()}</div>
  <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn" id="resetBtn">Reset all progress</button><span class="dim" id="resetMsg"></span></div>`;
  resetArmed=false;
  loadPhotos().then(refreshPhotoManager);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const ixel = e.target.closest('[data-ix]'); if (ixel && !$('#scr-ix').hidden){ if (!ixel.disabled) ixAct(ixel.dataset.ix, ixel.dataset.v); return; }
  const t = e.target.closest('button, [data-go], #homeNiff'); if (!t) return;
  if (t.dataset.ff && R && R.fin && !R.done){ R.fin.f=t.dataset.ff; return updFrac(); }
  if (t.id==='ixCheck') return checkIx();
  if (t.dataset.tile!==undefined) return buyTile(+t.dataset.tile);
  if (t.dataset.gtab){ galTab=t.dataset.gtab; return renderGallery(); }
  if (t.dataset.psave) return savePending(t.dataset.psave);
  if (t.dataset.pdiscard){ PENDING=PENDING.filter(x=>x.tmp!==t.dataset.pdiscard); return refreshPhotoManager(); }
  if (t.dataset.pdel) return deletePhoto(t.dataset.pdel, t);
  if (t.dataset.guess) return guessAnimal(t.dataset.guess);
  if (t.id==='galNext') return nextPicture();
  if (t.dataset.clue!==undefined) return openClue(+t.dataset.clue);
  if (t.dataset.cluecheck!==undefined) return checkClue(+t.dataset.cluecheck);
  if (t.id==='vaultCheck') return checkVault();
  if (t.id==='bonusCheck') return checkBonus();
  if (t.id==='ixNext') return nextIx();
  if (t.id==='homeNiff') return tickle();
  if (t.dataset.go){ const g=t.dataset.go; ({home:renderHome,hoard:renderHoard,notes:renderNotes,grown:renderGrown,gallery:()=>{ renderGallery(); loadPhotos().then(()=>{ if (!$('#scr-gallery').hidden) renderGallery(); }); },vault:renderVault}[g]||(()=>{}))(); return show(g); }
  if (t.dataset.topic){ renderTopic(t.dataset.topic); return show('topic'); }
  if (t.dataset.dim) return stepDim(t.dataset.dim, Number(t.dataset.d));
  if (t.id==='buildCheck') return checkBuild();
  if (t.id==='buildNext') return nextBuild();
  if (t.dataset.play) return startRound(t.dataset.play, t.dataset.level);
  if (t.dataset.opt!==undefined) return chooseOpt(t);
  if (t.dataset.key) return padKey(t.dataset.key);
  if (t.dataset.item) return buyItem(t.dataset.item);
  if (t.dataset.fur) return buyFur(t.dataset.fur);
  if (t.id==='hintBtn') return showHint();
  if (t.id==='nextBtn') return next();
  if (t.id==='leaveBtn' || t.id==='balLeave' || t.id==='buildLeave' || t.id==='ixLeave'){ renderTopic(curTopic); return show('topic'); }
  if (t.id==='resetBtn'){
    if (!resetArmed){ resetArmed=true; t.textContent='Tap again to erase everything'; $('#resetMsg').textContent='This cannot be undone.'; return; }
    const keep={player:S.player,name:S.name,settings:S.settings}; S=Object.assign(clone(DEFAULT),keep); save(); coinsUI(); renderGrown(); $('#resetMsg').textContent='Progress erased.';
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input')){ if (e.key==='Enter'){ const id=e.target.id; if (id==='vaultAns') checkVault(); else if (id==='bonusAns') checkBonus(); else if (id.startsWith('clue-')) checkClue(+id.slice(5)); } return; }
  if (e.target.id==='homeNiff' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); return tickle(); }
  if ($('#scr-play').hidden || !R) return;
  if (/^[0-9]$/.test(e.key)) padKey(e.key);
  else if (e.key==='.') padKey('.');
  else if (e.key==='Backspace') padKey('⌫');
  else if (e.key==='Enter'){ if (R.done) next(); else padKey('ok'); }
});
document.addEventListener('change', e => {
  const id=e.target.id;
  if (id==='photoIn'){ onPhotoFiles(Array.from(e.target.files||[])); e.target.value=''; return; }
  if (id==='setSound') S.settings.sound=e.target.checked;
  if (id==='setSpeak') S.settings.speak=e.target.checked;
  if (id==='setHints') S.settings.hints=e.target.checked;
  save();
});
document.addEventListener('input', e => {
  if (e.target.id==='setPlayer') S.player=e.target.value.trim()||'friend';
  if (e.target.id==='setName') S.name=e.target.value.trim()||'Niffler';
  save();
});

coinsUI(); renderHome(); show('home'); loadPhotos();
window.__NH = {G, GAMES, BAL, BUILD, solveBuild, ALL_GAMES, IX, wsum, niffSVG, ANIMALS, vaultSim, paintSVG, PDB, loadPhotos, LVL};
})();
</script>
</body>
</html>
