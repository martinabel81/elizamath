<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Niffler's Hoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one burrow column (max 1000px); screens swap in place; play = Niffler beside a big question card. Single deliberate dark "underground" look. */
:root{
  --soil:#1b1423; --soil-2:#241b2f; --tunnel:#2e2340; --tunnel-2:#3b2e50; --root:#5a4874;
  --gold:#f7c74b; --gold-deep:#d9951b; --ink:#f8f1e4; --ink-dim:#c6b9d0;
  --good:#66d9a3; --oops:#ff9481; --gem1:#7fd6ff; --gem2:#ff94c9;
  --cube-top:#ffd56b; --cube-l:#e0a43a; --cube-r:#b97b22;
  --display:'Lilita One','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--soil);color:var(--ink);font-family:var(--body);font-weight:700;font-size:18px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -10%, rgba(247,199,75,.10), transparent 60%),
  radial-gradient(3px 3px at 12% 30%, rgba(255,255,255,.07) 50%, transparent 51%),
  radial-gradient(2px 2px at 78% 62%, rgba(255,255,255,.06) 50%, transparent 51%),
  radial-gradient(3px 3px at 40% 85%, rgba(255,255,255,.05) 50%, transparent 51%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
sup{font-size:.6em;line-height:0;position:relative;top:-.15em;vertical-align:super}
.app{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05}
h2{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h3{font-size:1.35rem}
p{margin:0}
.dim{color:var(--ink-dim)}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--display);font-size:1.5rem;color:var(--gold);padding:6px 0}
.bar nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.navbtn{padding:10px 16px;border-radius:999px;background:var(--tunnel);border:2px solid var(--root);min-height:48px}
.navbtn[aria-current="true"]{background:var(--tunnel-2);border-color:var(--gold)}
.purse{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--tunnel-2);border:2px solid var(--gold-deep);font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;min-height:48px}
.coin-ico{width:24px;height:24px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);flex:none}
.purse.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:18px;background:var(--tunnel-2);border:2px solid var(--root);font-weight:900;font-size:1.05rem}
.btn:active{transform:translateY(2px)}
.btn.gold{background:var(--gold);color:#2b1d07;border-color:var(--gold-deep);box-shadow:0 4px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.deep{background:#5b3fa0;border-color:#8a6fe0;box-shadow:0 4px 0 #3a2870}
.btn[disabled]{opacity:.45;cursor:default}

/* Niffler */
.niff{position:relative;width:100%;max-width:240px;aspect-ratio:200/230;cursor:pointer;user-select:none}
.niff svg{width:100%;height:100%;display:block;overflow:visible}
.niff.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.niff.tilt{animation:tilt .7s}
.niff.wiggle{animation:wiggle .6s}
.niff.swipe{animation:swipe 1.4s ease-in-out}
@keyframes hop{30%{transform:translateY(-22%) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes tilt{30%{transform:rotate(-9deg)}70%{transform:rotate(6deg)}}
@keyframes wiggle{20%{transform:rotate(6deg)}40%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}80%{transform:rotate(-3deg)}}
@keyframes swipe{0%{transform:none}35%{transform:translateX(160%) rotate(12deg);opacity:0}55%{transform:translateX(-160%);opacity:0}100%{transform:none;opacity:1}}
.bubble{position:relative;background:var(--ink);color:#2a1d36;border-radius:20px;padding:12px 16px;font-weight:800;font-size:1rem;max-width:300px;min-height:3em}
.bubble::after{content:"";position:absolute;left:36px;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.bubble sup{color:#6a3fc0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;padding:20px 24px;border-radius:28px;background:linear-gradient(160deg,var(--tunnel-2),var(--tunnel));border:2px solid var(--root);margin-bottom:28px}
.hero .left{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .niff{justify-self:center}
.kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:900}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:22px;background:var(--tunnel);border:2px solid var(--root);min-height:150px}
.topic .glyph{font-family:var(--display);font-size:2.2rem;color:var(--gold);line-height:1;margin-bottom:6px}
.topic.open{border-color:var(--gold-deep);background:linear-gradient(170deg,#4a3566,var(--tunnel))}
.topic.locked{opacity:.6;cursor:default}
.topic.locked .glyph{color:var(--ink-dim)}
.tag{display:inline-block;font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--soil-2);color:var(--ink-dim);margin-top:auto}
.topic.open .tag{background:var(--gold);color:#2b1d07}

/* topic screen */
.topic-head{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.formula{font-family:var(--display);font-size:1.4rem;color:var(--gold)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:24px;background:var(--tunnel);border:2px solid var(--root)}
.game .glyph{font-family:var(--display);font-size:2.4rem;color:var(--gold);line-height:1}
.game .row{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.game .row .btn{flex:1 1 120px}
.prog{font-size:.9rem;color:var(--ink-dim);display:flex;gap:12px;flex-wrap:wrap}
.prog b{color:var(--good)}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.extra{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 20px;border-radius:24px;background:var(--soil-2);border:2px dashed var(--root);min-height:84px}
.extra .glyph{font-family:var(--display);font-size:1.8rem;color:var(--gem1)}

/* play */
.play-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:8px;margin-left:auto}
.dot{width:18px;height:18px;border-radius:50%;background:var(--soil-2);border:2px solid var(--root)}
.dot.done{background:var(--gold);border-color:var(--gold-deep)}
.dot.now{border-color:var(--gold);transform:scale(1.25)}
.lvl{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--tunnel-2)}
.lvl.adv{background:#5b3fa0}
.play-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.play-niff{display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:12px}
.play-niff .bubble{order:-1;font-size:.95rem}
.play-niff .niff{max-width:170px}
.qcard{padding:24px;border-radius:28px;background:var(--tunnel);border:2px solid var(--root);display:flex;flex-direction:column;gap:18px;min-width:0}
.qtitle{font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.prompt{font-size:1.3rem;line-height:1.5;font-weight:800}
.big{display:inline-block;font-family:var(--display);font-weight:400;font-size:2.1rem;letter-spacing:.02em;line-height:1.5;margin-top:4px}
.claim{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--gold);padding:10px 18px;margin:8px 0;border-radius:18px;background:var(--soil-2);display:inline-block}
.slot{display:inline-block;min-width:1.3em;padding:0 .15em;text-align:center;color:var(--gold);border-bottom:4px dashed var(--gold);line-height:1.1}
.slot.filled{border-bottom-style:solid}
.fig{display:block;width:100%;height:auto;margin:0 auto}
.coin{fill:var(--gold);stroke:var(--gold-deep);stroke-width:2}
.coin-in{fill:none;stroke:var(--gold-deep);stroke-width:1.5;opacity:.7}
.gem{stroke:rgba(255,255,255,.55);stroke-width:1.5}
.cube-top{fill:var(--cube-top);stroke:#7a4f12;stroke-width:1.2}
.cube-l{fill:var(--cube-l);stroke:#7a4f12;stroke-width:1.2}
.cube-r{fill:var(--cube-r);stroke:#7a4f12;stroke-width:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:72px;padding:14px;border-radius:18px;background:var(--tunnel-2);border:3px solid var(--root);font-family:var(--display);font-size:1.45rem;font-weight:400;line-height:1.3}
.opt.small{font-family:var(--body);font-weight:800;font-size:1.05rem}
.opt.right{border-color:var(--good);background:#235a45}
.opt.wrong{border-color:var(--oops);opacity:.55}
.display{min-height:64px;border-radius:16px;background:var(--soil-2);border:3px solid var(--root);font-family:var(--display);font-size:2rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px;width:100%;margin:0 auto}
.key{min-height:64px;border-radius:16px;background:var(--tunnel-2);border:2px solid var(--root);font-family:var(--display);font-size:1.7rem;box-shadow:0 3px 0 var(--soil)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.check{grid-column:1/-1;background:var(--gold);color:#2b1d07;border-color:var(--gold-deep);box-shadow:0 4px 0 var(--gold-deep);font-size:1.4rem}
.pad.off .key{opacity:.4;pointer-events:none}
.feedback{font-size:1.1rem;font-weight:800;min-height:1.5em}
.feedback .good{color:var(--good);font-family:var(--display);font-weight:400;font-size:1.5rem}
.feedback .oops{color:var(--oops)}
.explain{margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--soil-2);font-weight:700;color:var(--ink)}
.mischief{margin-top:10px;padding:12px 16px;border-radius:14px;background:#4d2f14;border:2px dashed var(--gold);color:var(--gold)}
.qactions{display:flex;gap:12px;flex-wrap:wrap}
.hints{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;color:var(--gem1);font-weight:800}
.hints:empty{display:none}

/* end */
.end{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:center;padding:24px;border-radius:28px;background:linear-gradient(160deg,var(--tunnel-2),var(--tunnel));border:2px solid var(--gold-deep)}
.end .stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:12px 16px;border-radius:16px;background:var(--soil-2);min-width:120px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.found{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:20px;background:var(--soil-2);border:2px solid var(--root)}
.found .shiny{width:72px;height:72px;flex:none}
.wonder{padding:16px 18px;border-radius:20px;background:#163246;border:2px solid var(--gem1)}
.wonder .kicker{color:var(--gem1)}
.end-actions{display:flex;gap:12px;flex-wrap:wrap}

/* hoard */
.hoard-top{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:24px}
.hoard-niff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border-radius:28px;background:radial-gradient(circle at 50% 70%,#4a3566,var(--tunnel));border:2px solid var(--root)}
.section-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border-radius:18px;background:var(--tunnel);border:2px solid var(--root);min-height:110px}
.item.on{border-color:var(--good)}
.item .cost{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;margin-top:auto;font-weight:900}
.item .cost .coin-ico{width:18px;height:18px}
.item .swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--soil)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.cell{aspect-ratio:1;border-radius:16px;background:var(--soil-2);border:2px solid var(--root);display:flex;align-items:center;justify-content:center;padding:8px}
.cell .shiny{width:100%;height:100%}
.cell.empty{border-style:dashed;opacity:.5}
.cell.empty::after{content:"?";font-family:var(--display);font-size:1.4rem;color:var(--root)}
.shiny.rare{filter:drop-shadow(0 0 6px rgba(255,240,170,.85))}
.wonders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wonders .wonder.locked{background:var(--soil-2);border-color:var(--root);border-style:dashed;color:var(--ink-dim)}

/* notes + grown-ups */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.note{padding:16px 18px;border-radius:20px;background:var(--tunnel);border:2px solid var(--root);display:flex;flex-direction:column;gap:6px}
.note .ex{font-family:var(--display);font-size:1.4rem;color:var(--gold)}
.form{display:grid;gap:14px;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text]{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--root);background:var(--soil-2);color:var(--ink);min-height:52px}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px}
.toggle input{width:28px;height:28px;accent-color:var(--gold)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;min-width:520px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--root)}
th{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
footer{margin-top:40px;display:flex;justify-content:center}
.linkbtn{color:var(--ink-dim);text-decoration:underline;padding:12px}

.flycoin{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);pointer-events:none;z-index:50}
.rain{position:fixed;top:-30px;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-deep);pointer-events:none;z-index:40;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* balloon pop */
.bal-prompt{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;border-radius:24px;background:var(--tunnel);border:2px solid var(--root);margin-bottom:12px}
.bal-prompt .ask{font-family:var(--display);font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.15}
.bal-prompt .sub{display:block;font-family:var(--body);font-size:1rem;color:var(--ink-dim);font-weight:800;margin-top:2px}
.bal-prompt .bubble{margin-left:auto;font-size:.95rem;max-width:280px;min-height:0}
.bal-prompt .bubble::after{display:none}
.stage{position:relative;height:min(64vh,620px);min-height:420px;border-radius:28px;overflow:hidden;border:2px solid var(--root);background:linear-gradient(180deg,#2d4373 0%,#3c3062 58%,#2a1f38 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 18%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(2px 2px at 64% 9%,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(2px 2px at 86% 30%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(2px 2px at 40% 36%,rgba(255,255,255,.3) 50%,transparent 51%);pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:44px;background:#3a2a1e;border-top:4px solid #5c4231;z-index:2;pointer-events:none}
.balloon{position:absolute;left:0;top:0;width:112px;height:152px;cursor:pointer;will-change:transform;z-index:1}
.balloon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.balloon .lbl{position:absolute;left:4px;right:4px;top:36px;text-align:center;font-family:var(--display);font-size:1.8rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);pointer-events:none;line-height:1;white-space:nowrap}
.balloon .lbl.sm{font-size:1.35rem;top:42px}
.balloon.glow svg{filter:drop-shadow(0 0 10px #fff6c2) drop-shadow(0 0 4px #fff6c2)}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;z-index:4}
.popword{position:absolute;font-family:var(--display);font-size:2.2rem;color:var(--gold);pointer-events:none;z-index:4;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.stage-niff{position:absolute;left:10px;bottom:14px;width:92px;z-index:0;pointer-events:none}
.stage-niff .niff{max-width:92px;cursor:default}
.bal-feedback{min-height:2.6em;margin-top:12px;font-weight:800;font-size:1.1rem}
.bal-feedback .good{color:var(--good);font-family:var(--display);font-weight:400;font-size:1.5rem}
.bal-feedback .oops{color:var(--oops)}
.game.featured{border-color:var(--gem1);background:linear-gradient(170deg,#28456a,var(--tunnel))}
.game.featured .glyph{color:var(--gem1)}
@media (max-width:720px){
  .hero,.end,.hoard-top{grid-template-columns:1fr}
  .hero .niff{max-width:170px;grid-row:1}
  .play-grid{grid-template-columns:1fr}
  .play-niff{position:static;flex-direction:row;align-items:center}
  .play-niff .bubble{order:2;flex:1}
  .play-niff .niff{max-width:96px}
  .end .niff{max-width:150px;justify-self:center}
}
@media (max-width:460px){
  .opts{grid-template-columns:1fr}
  .big{font-size:1.7rem}
  .claim{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <button class="brand" data-go="home">Niffler's Hoard</button>
    <nav>
      <button class="navbtn" data-go="home" id="nav-home">Burrows</button>
      <button class="navbtn" data-go="hoard" id="nav-hoard">Hoard Room</button>
    </nav>
    <div class="purse" id="purse" aria-label="coins"><span class="coin-ico"></span><b id="coinCount">0</b></div>
  </header>

  <main>
    <section id="scr-home"></section>
    <section id="scr-topic" hidden></section>
    <section id="scr-play" hidden>
      <div class="play-top">
        <button class="btn" id="leaveBtn">&larr; Exponent Tunnel</button>
        <span class="lvl" id="lvlTag">Basic</span>
        <div class="dots" id="dots"></div>
      </div>
      <div class="play-grid">
        <aside class="play-niff">
          <div class="bubble" id="playBubble"></div>
          <div class="niff" id="playNiff"></div>
        </aside>
        <div class="qcard">
          <div class="qtitle" id="qTitle"></div>
          <div class="prompt" id="qPrompt"></div>
          <div id="qFig"></div>
          <div id="qAnswer"></div>
          <div class="feedback" id="qFeedback" aria-live="polite"></div>
          <ol class="hints" id="hintList"></ol>
          <div class="qactions">
            <button class="btn" id="hintBtn">Hint</button>
            <button class="btn gold" id="nextBtn" hidden>Next &rarr;</button>
          </div>
        </div>
      </div>
    </section>
    <section id="scr-balloon" hidden>
      <div class="play-top">
        <button class="btn" id="balLeave">&larr; Exponent Tunnel</button>
        <span class="lvl" id="balLvl">Basic</span>
        <div class="dots" id="balDots"></div>
      </div>
      <div class="bal-prompt">
        <div><div class="ask" id="balAsk"></div><span class="sub" id="balSub"></span></div>
        <div class="bubble" id="balBubble"></div>
      </div>
      <div class="stage" id="stage">
        <div class="stage-niff"><div class="niff" id="balNiff"></div></div>
        <div class="ground"></div>
      </div>
      <div class="bal-feedback" id="balFeedback" aria-live="polite"></div>
    </section>
    <section id="scr-end" hidden></section>
    <section id="scr-hoard" hidden></section>
    <section id="scr-notes" hidden></section>
    <section id="scr-grown" hidden></section>
  </main>

  <footer><button class="linkbtn" data-go="grown">Grown-up settings</button></footer>
</div>

<script>
(() => {
'use strict';
/* ---------- state ---------- */
const KEY = 'nifflersHoard.v1';
const DEFAULT = {coins:0, shinies:[], owned:[], wear:{}, fur:'lilac', furs:['lilac'], name:'Niffler', player:'friend',
  stats:{}, wonders:[], settings:{sound:true, speak:false, hints:true}, tickleDay:'', tickles:0};
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY));
    if (r && typeof r === 'object') { const s = Object.assign(clone(DEFAULT), r); s.settings = Object.assign({}, DEFAULT.settings, r.settings || {}); return s; }
  } catch(e) {}
  return clone(DEFAULT);
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const P = (a,b) => `${a}<sup>${b}</sup>`;
const fmt = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:6});
const SLOT = '<span class="slot"></span>';
const times = (a,n) => Array(n).fill(a).join(' × ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

const pad = (key,prompt,answer,hints,explain,fig='') => ({type:'pad',key,prompt,answer,hints,explain,fig});
const mcq = (key,prompt,options,hints,explain,fig='',small=false) => ({type:'mcq',key,prompt,options:options.map(String),hints,explain,fig,small});
// claim: options[0] is always the correct choice
function claim(key,text,truth,fix,wrongs,explain){
  const lab = w => (w && typeof w==='object') ? w.raw : `Wrong, it should be ${w}`;
  const opts = truth ? ['Niffler is right!', ...wrongs.slice(0,2).map(lab)]
                     : [lab(fix), 'Niffler is right!', ...wrongs.slice(0,1).map(lab)];
  return mcq(key, `Niffler puffs out its chest and says:<br><span class="claim">${text}</span><br>Is Niffler right?`, opts,
    ['Work it out yourself first, then compare.', 'Write the powers out as multiplication.', 'Niffler likes to rush. Check every step.'], explain, '', true);
}

/* ---------- figures ---------- */
function coinsFig(n){
  const per=8, r=11, g=27, rows=Math.ceil(n/per), w=Math.min(n,per)*g+6, h=rows*g+6;
  let s=''; for (let i=0;i<n;i++){ const x=3+r+(i%per)*g, y=3+r+Math.floor(i/per)*g;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" class="coin"/><circle cx="${x}" cy="${y}" r="${r-4}" class="coin-in"/>`; }
  return `<svg class="fig" viewBox="0 0 ${w} ${h}" style="max-width:${Math.round(w*1.3)}px" role="img" aria-label="${n} coins">${s}</svg>`;
}
function gemGrid(n,layered=false){
  const g=36, w=n*g+6; let s='';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){ const x=3+c*g+g/2, y=3+r*g+g/2, layer=Math.max(r,c);
    const fill = layered ? (layer%2 ? 'var(--gem2)' : 'var(--gem1)') : 'var(--gem1)';
    s+=`<path d="M${x} ${y-13}L${x+12} ${y}L${x} ${y+13}L${x-12} ${y}Z" fill="${fill}" class="gem"/>`; }
  return `<svg class="fig" viewBox="0 0 ${w} ${w}" style="max-width:${Math.min(Math.round(w*1.15),330)}px" role="img" aria-label="${n} by ${n} square of gems">${s}</svg>`;
}
function isoCube(n){
  const u=Math.min(30,120/n), c=.866, pt=(x,y,z)=>[(x-y)*u*c,(x+y)*u*.5-z*u]; let s='';
  const q=(pts,cls)=>{ s+=`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" class="${cls}"/>`; };
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    q([pt(i,j,n),pt(i+1,j,n),pt(i+1,j+1,n),pt(i,j+1,n)],'cube-top');
    q([pt(n,i,j),pt(n,i+1,j),pt(n,i+1,j+1),pt(n,i,j+1)],'cube-r');
    q([pt(i,n,j),pt(i+1,n,j),pt(i+1,n,j+1),pt(i,n,j+1)],'cube-l');
  }
  const W=n*u*c, H=n*u;
  return `<svg class="fig" viewBox="${(-W-4).toFixed(1)} ${(-H-4).toFixed(1)} ${(2*W+8).toFixed(1)} ${(2*H+8).toFixed(1)}" style="max-width:260px" role="img" aria-label="cube of blocks">${s}</svg>`;
}

/* ---------- question generators: Exponent Tunnel ---------- */
const G = {};
G.double = { basic:[
  () => { const n=ri(2,5), v=2**n; return pad('d1'+n, `Niffler finds 1 coin. Every night the pile <b>doubles</b>. How many coins after <b>${plural(n,'night')}</b>?`, v,
    ['Night 1: 1 × 2 = 2 coins.', 'Keep multiplying by 2: 2, 4, 8, 16 …', `That is 2 multiplied ${n} times, written ${P(2,n)}.`],
    `${P(2,n)} = ${times(2,n)} = ${v} coins.`, coinsFig(v)); },
  () => { const s=pick([3,5,10]), n=ri(2,3), v=s*2**n; return pad('d2'+s+n, `Niffler starts with <b>${s} coins</b>. The pile doubles every night. How many coins after <b>${n} nights</b>?`, v,
    [`After night 1: ${s} × 2 = ${s*2}.`, 'Each night, multiply by 2 again.', `${s} × ${P(2,n)} = ${s} × ${2**n}.`],
    `${s} × ${P(2,n)} = ${s} × ${2**n} = ${v} coins.`); },
  () => { const n=ri(3,6); return pad('d3'+n, `Write it the short way:<br><span class="big">${times(2,n)} = 2<sup>${SLOT}</sup></span>`, n,
    ['Count how many 2s are multiplied.', 'The exponent is the count of 2s.', `Point at each 2 and count: 1, 2, 3 …`],
    `${n} twos multiplied together is ${P(2,n)} = ${2**n}.`); },
  () => { const T=pick([20,50,100]); let n=0; while (2**n<=T) n++;
    return pad('d4'+T, `Niffler starts with 1 coin and the pile doubles every night. After how many nights does Niffler have <b>more than ${T}</b> coins?`, n,
    ['List the piles: 2, 4, 8, 16, 32, 64, 128, 256, 512 …', 'Night 1 = 2, night 2 = 4, night 3 = 8 …', `Find the first pile bigger than ${T}.`],
    `After ${n} nights the pile is ${P(2,n)} = ${2**n}, the first pile bigger than ${T}. One night earlier it was only ${2**(n-1)}.`); },
], adv:[
  () => { const n=ri(2,4), v=3**n; return pad('a1'+n, `A magic pouch <b>triples</b> its coins every night, starting with 1 coin. How many after <b>${n} nights</b>?`, v,
    ['Night 1: 1 × 3 = 3.', 'Keep multiplying by 3: 3, 9, 27 …', `That is ${P(3,n)}.`], `${P(3,n)} = ${times(3,n)} = ${fmt(v)} coins.`); },
  () => { const n=ri(5,8), v=2**n; return pad('a2'+n, `Niffler folds a sheet of paper in half <b>${n} times</b>. How many layers thick is it?`, v,
    ['Each fold doubles the layers: 2, 4, 8 …', `So the answer is ${P(2,n)}.`, `${P(2,5)} = 32. Keep doubling from 32.`],
    `${P(2,n)} = ${fmt(v)} layers. Folded 42 times, the paper would reach past the Moon!`); },
  () => { const [a,b]=pick([[2,5],[2,6],[3,4],[2,4],[3,5],[2,3],[4,5]]); const x=a**b, y=b**a;
    const opts=[`${P(a,b)} is bigger`,`${P(b,a)} is bigger`,'They are equal']; const c = x>y?0:x<y?1:2;
    return mcq('a3'+a+b, `Which treasure is bigger: <span class="big">${P(a,b)}</span> or <span class="big">${P(b,a)}</span>?`, [c,...[0,1,2].filter(i=>i!==c)].map(i=>opts[i]),
      [`Work out ${P(a,b)} first.`, `${P(a,b)} = ${fmt(x)}.`, `${P(b,a)} = ${fmt(y)}.`],
      `${P(a,b)} = ${fmt(x)} and ${P(b,a)} = ${fmt(y)}. ${c===2 ? `A rare tie! ${P(2,4)} and ${P(4,2)} are the only pair of different whole numbers that do this.` : 'Swapping the base and exponent changes the answer.'}`, '', true); },
  () => { const n=ri(9,20), d=[6,2,4,8][n%4]; return pad('a4'+n, `What is the <b>last digit</b> of <span class="big">${P(2,n)}</span>?<br>No need to work out the whole number!`, d,
    ['Write the first few: 2, 4, 8, 16, 32, 64, 128, 256.', 'The last digits repeat: 2, 4, 8, 6, 2, 4, 8, 6 …', `The pattern repeats every 4. ${n} ÷ 4 leaves remainder ${n%4}. (Remainder 1 → 2, 2 → 4, 3 → 8, 0 → 6.)`],
    `Last digits of powers of 2 go round 2, 4, 8, 6. ${n} ÷ 4 has remainder ${n%4}, so the last digit is ${d}.`); },
  () => { const n=ri(4,7), v=2**n; return pad('a5'+n, `Niffler started with 1 coin. The pile doubled every night and now has <b>${fmt(v)}</b> coins. How many nights passed?`, n,
    ['Go backwards: halve the pile until you reach 1.', 'Count how many times you halved.', `It is the exponent in 2<sup>?</sup> = ${fmt(v)}.`], `${P(2,n)} = ${fmt(v)}, so ${n} nights passed.`); },
]};

G.code = { basic:[
  () => { const a=ri(2,5), b=a<=3?ri(2,4):ri(2,3), v=a**b; return pad('c1'+a+b, `<span class="big">${P(a,b)} = ${SLOT}</span>`, v,
    [`The little ${b} says how many ${a}s to multiply.`, `${P(a,b)} = ${times(a,b)}.`, 'Multiply step by step from the left.'], `${P(a,b)} = ${times(a,b)} = ${v}.`); },
  () => { let a=ri(2,9), n=ri(3,5); if (a===n) a++; return mcq('c2'+a+n, `Niffler stacked coins like this:<br><span class="big">${times(a,n)}</span><br>Which is the short way to write it?`,
    [P(a,n), P(n,a), a*n, `${a} + ${n}`], ['Which number is being multiplied?', 'How many times does it appear?', 'The repeated number is the base. The count sits up high as the exponent.'],
    `${a} appears ${n} times, so it is ${P(a,n)}.`); },
  () => { let a=ri(3,9), b=ri(2,5); if (a===b) a++; const ask=pick(['base','exponent']);
    return mcq('c3'+a+b+ask, `In <span class="big">${P(a,b)}</span>, which number is the <b>${ask}</b>?`, ask==='base'?[a,b,a**b,a*b]:[b,a,a**b,a*b],
      ['The base is the big number on the ground.', 'The exponent is the small number up high.', 'The exponent tells how many times to use the base.'],
      `In ${P(a,b)}, ${a} is the base and ${b} is the exponent. It means ${times(a,b)}.`); },
  () => { const a=ri(3,9); return mcq('c4'+a, `Niffler says squaring is easy. What is <span class="big">${P(a,2)}</span>?`, [a*a, 2*a, a+2, Number(`${a}2`)],
    ['Squared means the exponent is 2.', `${P(a,2)} = ${a} × ${a}, not ${a} × 2.`, `Picture a square of gems with ${a} on each side.`],
    `${P(a,2)} = ${a} × ${a} = ${a*a}. The trap is ${a} × 2 = ${2*a}.`); },
], adv:[
  () => { const a=ri(3,20), e=pick([0,1]); return pad('k1'+a+e, `<span class="big">${P(a,e)} = ${SLOT}</span>`, e===0?1:a,
    e===0 ? [`Look at a pattern: ${P(2,3)} = 8, ${P(2,2)} = 4, ${P(2,1)} = 2.`, `Each step down divides by 2. So ${P(2,0)} = 2 ÷ 2.`, 'This works for any base except 0.']
          : ['The exponent says how many times to use the base.', 'Using the base once is just the base.', `${P(a,1)} is one ${a}.`],
    e===0 ? `${P(a,0)} = 1. Going down one exponent divides by the base, and ${a} ÷ ${a} = 1.` : `${P(a,1)} = ${a}: just one ${a}.`); },
  () => { const b=pick([2,3,5,10]), n=ri(2,{2:6,3:4,5:3,10:5}[b]), v=b**n; return pad('k2'+b+n, `<span class="big">${b}<sup>${SLOT}</sup> = ${fmt(v)}</span>`, n,
    [`Start multiplying: ${b}, ${fmt(b*b)}, ${fmt(b**3)} …`, `Count how many ${b}s you multiplied.`, `Keep going until you reach ${fmt(v)}.`], `${P(b,n)} = ${fmt(v)}.`); },
  () => { const n=pick([2,3]), b = n===2 ? ri(5,12) : ri(2,5), v=b**n; return pad('k3'+b+n, `What is the missing base?<br><span class="big">${SLOT}<sup>${n}</sup> = ${fmt(v)}</span>`, b,
    [n===2 ? 'Which number times itself makes it?' : 'Which number, used three times, makes it?', 'Make a guess and check it.', n===2 ? '10 × 10 = 100. Is the answer bigger or smaller than 10?' : `${P(2,3)} = 8, ${P(3,3)} = 27, ${P(4,3)} = 64 …`],
    `${P(b,n)} = ${times(b,n)} = ${fmt(v)}.`); },
  () => { const pool=[]; for (let a=2;a<=6;a++) for (let b=2;b<=5;b++){ const v=a**b; if (v<=300) pool.push([a,b,v]); }
    let set; do { set=shuffle(pool).slice(0,4); } while (new Set(set.map(s=>s[2])).size<4);
    const big=Math.random()<.5, sorted=set.slice().sort((x,y)=>big?y[2]-x[2]:x[2]-y[2]);
    return mcq('k4'+sorted.map(s=>s[0]+''+s[1]).join(''), `Niffler only wants the <b>${big?'biggest':'smallest'}</b> treasure. Which one?`, sorted.map(s=>P(s[0],s[1])),
      ['Work out each one.', 'Write the value under each power.', `Now pick the ${big?'biggest':'smallest'} number.`], sorted.map(s=>`${P(s[0],s[1])} = ${fmt(s[2])}`).join(', ')+'.'); },
  () => { const one=Math.random()<.5, n=ri(5,100); return pad('k5'+one+n, `<span class="big">${P(one?1:0,n)} = ${SLOT}</span>`, one?1:0,
    [`Write out the first few: ${one?'1 × 1 × 1':'0 × 0 × 0'} …`, 'Does the answer ever change?', 'More copies keep giving the same answer.'],
    one ? '1 times itself any number of times is still 1.' : `0 times anything is 0, so ${P(0,n)} = 0.`); },
]};

G.zero = { basic:[
  () => { const n=ri(1,6), v=10**n; return pad('z1'+n, `<span class="big">${P(10,n)} = ${SLOT}</span>`, v,
    ['Multiply 10 by itself.', `${P(10,n)} = ${times(10,n)}.`, `It is a 1 followed by ${plural(n,'zero')}.`], `${P(10,n)} = ${fmt(v)}: a 1 with ${plural(n,'zero')}.`); },
  () => { const n=ri(4,9); return pad('z2'+n, `Niffler digs up <span class="big">${P(10,n)}</span>. How many zeros does this number have?`, n,
    [`Try smaller ones: ${P(10,2)} = 100 has 2 zeros.`, `${P(10,3)} = 1,000 has 3 zeros.`, 'The exponent counts the zeros.'], `${P(10,n)} = ${fmt(10**n)}, which has ${n} zeros.`); },
  () => { const n=ri(2,7); return pad('z3'+n, `<span class="big">${fmt(10**n)} = 10<sup>${SLOT}</sup></span>`, n,
    ['Count the zeros.', 'Each zero is one more 10 multiplied in.', 'The exponent equals the number of zeros.'], `${fmt(10**n)} has ${n} zeros, so it is ${P(10,n)}.`); },
  () => { const k=ri(2,9), n=ri(1,3); return pad('z4'+k+n, `<span class="big">${k} × ${P(10,n)} = ${SLOT}</span>`, k*10**n,
    [`${P(10,n)} = ${fmt(10**n)}.`, `Multiplying by ${fmt(10**n)} adds ${plural(n,'zero')} to a whole number.`, `${k} becomes ${k} with ${plural(n,'zero')} after it.`], `${k} × ${fmt(10**n)} = ${fmt(k*10**n)}.`); },
  () => { let m; do { m=ri(11,99); } while (m%10===0); const x=m/10, n=ri(1,2), v=m*10**n/10;
    return pad('z5'+m+n, `<span class="big">${x} × ${P(10,n)} = ${SLOT}</span>`, v,
    [`${P(10,n)} = ${fmt(10**n)}.`, `Multiplying by ${fmt(10**n)} moves every digit ${plural(n,'place')} to the left.`, `Slide the decimal point ${plural(n,'place')} to the right.`],
    `${x} × ${fmt(10**n)} = ${fmt(v)}. The decimal point slides ${plural(n,'place')} right.`); },
], adv:[
  () => { let m; do { m=ri(101,999); } while (m%10===0); const x=m/100, n=ri(1,2), v=m*10**n/100;
    return pad('y1'+m+n, `<span class="big">${x} × ${P(10,n)} = ${SLOT}</span>`, v,
    [`${P(10,n)} = ${fmt(10**n)}.`, `Slide the decimal point ${plural(n,'place')} right.`, 'Fill any empty places with zeros.'], `${x} × ${fmt(10**n)} = ${fmt(v)}.`); },
  () => { let a; do { a=ri(12,250); } while (a%10===0); const n=ri(1,2), v=a/10**n;
    return pad('y2'+a+n, `<span class="big">${a} ÷ ${P(10,n)} = ${SLOT}</span>`, v,
    [`${P(10,n)} = ${fmt(10**n)}.`, `Dividing by ${fmt(10**n)} slides the decimal point ${plural(n,'place')} left.`, `${a} is the same as ${a}.0. Now move the point.`], `${a} ÷ ${fmt(10**n)} = ${fmt(v)}.`); },
  () => { const a=ri(2,6), b=ri(2,6); return pad('y3'+a+b, `<span class="big">${P(10,a)} × ${P(10,b)} = 10<sup>${SLOT}</sup></span>`, a+b,
    [`${P(10,a)} has ${a} zeros and ${P(10,b)} has ${b} zeros.`, 'When you multiply them, the zeros pile up together.', 'Add the exponents.'],
    `${fmt(10**a)} × ${fmt(10**b)} = ${fmt(10**(a+b))} = ${P(10,a+b)}.`); },
  () => { const d=ri(2,9), n=ri(3,6); return pad('y4'+d+n, `Scientists write big numbers the short way.<br><span class="big">${fmt(d*10**n)} = ${d} × 10<sup>${SLOT}</sup></span>`, n,
    [`Count the zeros after the ${d}.`, `${d} × 10 = ${d*10}, ${d} × 100 = ${d*100} …`, 'Each zero is one power of 10.'],
    `${fmt(d*10**n)} = ${d} × ${P(10,n)}. This is called scientific notation.`); },
  () => { const f=pick([['The Moon is about 384,000 km away.','3.84',5],['The Sun is about 150,000,000 km away.','1.5',8],['About 8,000,000,000 people live on Earth.','8',9],['A blue whale can weigh about 150,000 kg.','1.5',5],['Light travels about 300,000 km every second.','3',5]]);
    return pad('y5'+f[2]+f[1], `${f[0]}<br><span class="big">That is ${f[1]} × 10<sup>${SLOT}</sup></span>`, f[2],
    ['Multiplying by 10 slides the decimal point one place right.', `Start at ${f[1]} and count how many places the point must slide.`, 'Count the digits after the first digit of the big number.'],
    `${f[1]} × ${P(10,f[2])}: the point slides ${f[2]} places.`); },
  () => pad('y6', `Niffler's emptiest vault:<br><span class="big">${P(10,0)} = ${SLOT}</span>`, 1,
    [`${P(10,2)} = 100, ${P(10,1)} = 10 …`, 'Each step down divides by 10.', '10 ÷ 10 = ?'], `${P(10,0)} = 1. Each step down divides by 10, and 10 ÷ 10 = 1.`),
]};

G.gems = { basic:[
  () => { const n=ri(2,7); return pad('g1'+n, `Niffler laid out gems in a square. How many gems are there?<br>This is ${P(n,2)}, "${n} squared".`, n*n,
    [`Count one row: ${n} gems.`, `There are ${n} rows.`, `${n} × ${n}.`], `${P(n,2)} = ${n} × ${n} = ${n*n} gems.`, gemGrid(n)); },
  () => { const n=ri(2,4); return pad('g2'+n, `How many little gold blocks make this cube? It is ${n} blocks long, ${n} wide and ${n} tall.`, n**3,
    [`One layer is ${n} × ${n} = ${n*n} blocks.`, `There are ${n} layers.`, `That is ${P(n,3)}, "${n} cubed".`], `${P(n,3)} = ${times(n,3)} = ${n**3} blocks.`, isoCube(n)); },
  () => { const s=ri(4,10), sq=s*s, ds=new Set(); while (ds.size<3){ const d=sq+pick([-3,-2,-1,1,2,3,4,5]); if (d>1 && !Number.isInteger(Math.sqrt(d))) ds.add(d); }
    return mcq('g3'+s, 'Which number of gems can make a perfect square?', [sq,...ds],
      ['A square number is a whole number times itself.', 'Try 4 × 4 = 16, 5 × 5 = 25, 6 × 6 = 36 …', 'Which choice is on that list?'], `${sq} = ${s} × ${s} = ${P(s,2)}.`); },
  () => { const n=ri(4,10); return pad('g4'+n, `A square of gems has <b>${n*n}</b> gems. How many gems are along each side?`, n,
    ['Which number times itself makes it?', '10 × 10 = 100. Bigger or smaller?', 'Guess, then check.'], `${n} × ${n} = ${n*n}, so each side has ${n}. This is called the square root.`); },
], adv:[
  () => { const n=ri(4,7), odds=Array.from({length:n},(_,i)=>2*i+1); return pad('h1'+n, `Add the first ${n} odd numbers:<br><span class="big">${odds.join(' + ')} = ${SLOT}</span>`, n*n,
    ['Look at the picture: each new L-shape of colour is the next odd number.', 'The L-shapes build a square.', `The square is ${n} by ${n}.`],
    `${odds.join(' + ')} = ${n*n} = ${P(n,2)}. The first n odd numbers always add up to n squared.`, gemGrid(n,true)); },

G.catch = { basic:[

    : claim('u4'+n+'f', `${P(2,n)} + ${P(2,n)} = ${P(2,2*n)}`, false, P(2,n+1), [P(4,2*n)], `Adding is not multiplying! ${P(2,n)} + ${P(2,n)} = 2 × ${P(2,n)} = ${P(2,n+1)}.`); },

function tone(f,d,t=0,type='triangle',vol=.14){

  try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(), at=AC.currentTime+t;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.001,at+d); o.connect(g).connect(AC.destination); o.start(at); o.stop(at+d+.02);
  } catch(e) {}
}

const BAL_COLORS = ['#ff6b8b','#4fc3f7','#ffd54f','#7ed492','#bd7ce0','#ff9f43'];

  el.innerHTML = balloonSVG(pick(BAL_COLORS)) + `<div class="lbl${isSmall(label)?' sm':''}">${label}</div>`;
  el.setAttribute('role','button'); el.setAttribute('aria-label','balloon '+label.replace(/<sup>(.*?)<\/sup>/g,' to the power $1').replace(/<[^>]+>/g,''));
  $('#stage').appendChild(el);
  const b={el, lane, x:laneX(lane), y, phase:Math.random()*6, correct, label, dead:false};
  el.style.transform=`translate(${b.x}px,${y}px)`;
  BL.balloons.push(b); return b;
}
function loop(ts){
  if (!BL) return;
  const dt = BL.last ? Math.min(.05,(ts-BL.last)/1000) : 0; BL.last=ts; BL.t+=dt;
  for (const b of BL.balloons){ if (b.dead) continue;
    b.y -= BL.speed*dt;
    if (b.y < -160){ b.y = BL.H + ri(10,120); b.x = laneX(b.lane);
      if (!b.correct && R && !R.done){ const q=R.qs[R.i]; b.label=pick(q.others); b.el.querySelector('.lbl').innerHTML=b.label; b.el.querySelector('.lbl').className='lbl'+(isSmall(b.label)?' sm':''); } }
    b.el.style.transform=`translate(${(b.x+Math.sin(BL.t*1.1+b.phase)*10).toFixed(1)}px,${b.y.toFixed(1)}px)`;
  }
  BL.raf=requestAnimationFrame(loop);
}
function burst(b, color){
  const st=$('#stage'), cx=b.x+56+Math.sin(BL.t*1.1+b.phase)*10, cy=b.y+56;
  for (let k=0;k<12;k++){ const d=document.createElement('div'); d.className='spark'; d.style.background=k%3?color:'#fff6c2'; d.style.left=(cx-7)+'px'; d.style.top=(cy-7)+'px'; st.appendChild(d);
    const ang=k/12*Math.PI*2, dist=60+Math.random()*50;
    if (d.animate) d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(.3)`,opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>d.remove(); else setTimeout(()=>d.remove(),600); }
  const w=document.createElement('div'); w.className='popword'; w.textContent='POP!'; w.style.left=(cx-40)+'px'; w.style.top=(cy-30)+'px'; st.appendChild(w);
  if (w.animate) w.animate([{transform:'scale(.5)',opacity:1},{transform:'scale(1.3) translateY(-30px)',opacity:0}],{duration:800}).onfinish=()=>w.remove(); else setTimeout(()=>w.remove(),800);
}
const sPop = () => { tone(520,.06,0,'square',.08); tone(260,.12,.03,'triangle',.12); };
function tapBalloon(el){
  if (!BL || !R || R.done) return; const b=BL.balloons.find(x=>x.el===el); if (!b || b.dead) return;
  const q=R.qs[R.i], color=b.el.querySelector('path').getAttribute('fill');
  if (b.correct){
    R.done=true; b.dead=true; burst(b,color); b.el.remove(); sPop(); setTimeout(sDing,120);
    const clean=R.att===0, adv=R.level==='adv'; let c = clean?(adv?5:3):(adv?2:1); if (clean) R.first++;
    let extra='';
    if (R.i===R.mischief){ extra=` <span class="dim">Niffler grabbed your ${plural(c,'coin')}… and brought back ${c*2}!</span>`; c*=2; $('#balBubble').innerHTML='Hee hee! Coins love me.'; }
    else $('#balBubble').innerHTML=pick(CHEERS);
    S.coins+=c; R.earned+=c; save(); coinsUI(); bumpPurse(); flyCoins($('#balNiff'),c);
    anim($('#balNiff'),'hop');
    $('#balFeedback').innerHTML = `<span class="good">${pick(CHEERS)}</span> +${plural(c,'coin')}. ${q.explain}${extra}`;
    R.i++; balDots(); R.i--;
    BL.timer=setTimeout(()=>{ if (!BL) return; R.i++; if (R.i>=R.qs.length){ stopBalloon(); endRound(); } else setupTarget(); }, 2200);
  } else {
    R.att++; b.dead=true; sOops(); anim($('#balNiff'),'tilt');
    const cur=b.el.style.transform;
    if (b.el.animate) b.el.animate([{transform:cur,opacity:1},{transform:cur+' translateY(90px) rotate(25deg) scale(.4)',opacity:0}],{duration:700,easing:'ease-in',fill:'forwards'});
    const qi=R.i; setTimeout(()=>{ if (!BL) return; b.el.remove(); BL.balloons=BL.balloons.filter(x=>x!==b); if (!R.done && R.i===qi) spawn(pick(q.others), false, b.lane, BL.H+30); }, 750);
    $('#balFeedback').innerHTML = `<span class="oops">${R.att>=2?'Look for the glowing balloon!':'Not that one. Try another balloon!'}</span>`;
    if (R.att>=2){ BL.balloons.filter(x=>x.correct).forEach(x=>x.el.classList.add('glow')); $('#balBubble').innerHTML=`Psst… ${q.explain}`; }
  }
}
document.addEventListener('pointerdown', e => { const el=e.target.closest && e.target.closest('.balloon'); if (el){ e.preventDefault(); tapBalloon(el); } });
window.addEventListener('resize', () => { if (BL){ measure(); BL.balloons.forEach(b=>{ if (b.lane>=BL.lanes) b.lane=BL.lanes-1; b.x=laneX(b.lane); }); } });

/* ---------- end of round ---------- */
function endRound(){
  const {gid, level, first, earned} = R;
  S.stats[gid] = S.stats[gid] || {};
  const st = S.stats[gid][level] || {rounds:0, best:0, firstTotal:0};
  st.rounds++; st.best=Math.max(st.best,first); st.firstTotal=(st.firstTotal||0)+first; S.stats[gid][level]=st;
  const rare = level==='adv' ? '1' : '0';
  const left = ALL_SHINIES.filter(id => id.endsWith('-'+rare) && !S.shinies.includes(id));
  let shiny=null, bonus=0;
  if (left.length){ shiny=pick(left); S.shinies.push(shiny); } else { bonus=10; S.coins+=bonus; }
  let wonder=null;
  if (level==='adv' && !S.wonders.includes(gid)){ S.wonders.push(gid); wonder=WONDERS[gid]; }
  save(); coinsUI(); sFan(); coinRain();
  const g=GAMES.find(x=>x.id===gid), other = level==='adv'?'basic':'adv';
  $('#scr-end').innerHTML = `
  <div class="end">
    <div class="niff hop" id="endNiff">${niffSVG(S.fur,S.wear)}</div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <span class="kicker">${g.name} · ${level==='adv'?'Advanced':'Basic'}</span>
      <h1>${first>=5?'Treasure master!':first>=3?'What a haul!':'Round complete!'}</h1>
      <div class="stats"><div class="stat"><b>${first}/6</b>right first try</div><div class="stat"><b>+${earned+bonus}</b>coins</div></div>
      ${shiny ? `<div class="found">${shinySVG(shiny)}<div><span class="kicker">New shiny for the hoard</span><h3>${shinyName(shiny)}</h3><span class="dim">${S.shinies.length} of ${ALL_SHINIES.length} found</span></div></div>`
              : `<div class="found"><div><span class="kicker">Hoard full!</span><h3>Niffler found 10 bonus coins instead</h3></div></div>`}
      ${wonder ? `<div class="wonder"><span class="kicker">New Wonder Card</span><p>${wonder}</p></div>` : ''}
      <div class="end-actions">
        <button class="btn gold" data-play="${gid}" data-level="${level}">Play again</button>
        <button class="btn ${other==='adv'?'deep':''}" data-play="${gid}" data-level="${other}">Try ${other==='adv'?'Advanced':'Basic'}</button>
        <button class="btn" data-topic="exp">Back to the tunnel</button>
      </div>
    </div>
  </div>`;
  show('end');
  speak(`Round complete! ${first} out of 6 right first try.`);
}

/* ---------- hoard ---------- */
function renderHoard(){
  $('#scr-hoard').innerHTML = `
  <div class="hoard-top">
    <div class="hoard-niff"><div class="niff" id="hoardNiff">${niffSVG(S.fur,S.wear)}</div><h3>${esc(S.name)}</h3></div>
    <div style="min-width:0">
      <span class="kicker">The Hoard Room</span>
      <h1>Dress up ${esc(S.name)}</h1>
      <p class="dim" style="margin-top:8px">Spend coins on outfits. Tap something you own to put it on or take it off. Coins are never lost.</p>
      <div class="section-title"><h3>Outfits</h3></div>
      <div class="shop">${ITEMS.map(it => { const own=S.owned.includes(it.id), on=S.wear[it.slot]===it.id;
        return `<button class="item${on?' on':''}" data-item="${it.id}"><b>${it.name}</b><span class="dim">${on?'Wearing':own?'Tap to wear':''}</span>${own?'':`<span class="cost"><span class="coin-ico"></span>${it.cost}</span>`}</button>`; }).join('')}</div>
      <div class="section-title"><h3>Fur colour</h3></div>
      <div class="shop">${Object.entries(FURS).map(([id,f]) => { const own=S.furs.includes(id), on=S.fur===id;
        return `<button class="item${on?' on':''}" data-fur="${id}"><span class="swatch" style="background:${f.main}"></span><b>${f.n}</b>${own?`<span class="dim">${on?'Wearing':'Tap to wear'}</span>`:`<span class="cost"><span class="coin-ico"></span>${f.cost}</span>`}</button>`; }).join('')}</div>
      <p class="feedback" id="shopMsg" aria-live="polite"></p>
    </div>
  </div>
  <div class="section-title"><h2>Shiny collection</h2><span class="dim">${S.shinies.length} of ${ALL_SHINIES.length} found. Basic rounds find shinies; Advanced rounds find glowing ones.</span></div>
  <div class="shelf">${ALL_SHINIES.map(id => S.shinies.includes(id) ? `<div class="cell" title="${shinyName(id)}">${shinySVG(id)}</div>` : '<div class="cell empty"></div>').join('')}</div>
  <div class="section-title"><h2>Wonder Cards</h2><span class="dim">Finish an Advanced round in each game to collect them all.</span></div>
  <div class="wonders">${GAMES.map(g => S.wonders.includes(g.id)
    ? `<div class="wonder"><span class="kicker">${g.name}</span><p>${WONDERS[g.id]}</p></div>`
    : `<div class="wonder locked"><span class="kicker">${g.name}</span><p>Finish an Advanced round to reveal this card.</p></div>`).join('')}</div>`;
}
function buyItem(id){
  const it=ITEMS.find(x=>x.id===id); const msg=$('#shopMsg');
  if (!S.owned.includes(id)){
    if (S.coins<it.cost){ msg.innerHTML=`<span class="oops">You need ${it.cost-S.coins} more coins for the ${it.name}.</span>`; return; }
    S.coins-=it.cost; S.owned.push(id); S.wear[it.slot]=id; sFan();
  } else S.wear[it.slot] = S.wear[it.slot]===id ? null : id;
  save(); coinsUI(); renderHoard(); anim($('#hoardNiff'),'hop');
}
function buyFur(id){
  const f=FURS[id];
  if (!S.furs.includes(id)){
    if (S.coins<f.cost){ $('#shopMsg').innerHTML=`<span class="oops">You need ${f.cost-S.coins} more coins for ${f.n} fur.</span>`; return; }
    S.coins-=f.cost; S.furs.push(id); sFan();
  }
  S.fur=id; save(); coinsUI(); renderHoard(); anim($('#hoardNiff'),'wiggle');
}

/* ---------- grown-ups ---------- */
let resetArmed=false;
function renderGrown(){
  const rows = GAMES.map(g => { const b=stat(g.id,'basic'), a=stat(g.id,'adv');
    const pct = s => s.rounds ? Math.round(100*(s.firstTotal||0)/(6*s.rounds))+'%' : '–';
    return `<tr><td>${g.name}</td><td>${b.rounds}</td><td>${pct(b)}</td><td>${a.rounds}</td><td>${pct(a)}</td></tr>`; }).join('');
  $('#scr-grown').innerHTML = `
  <div class="topic-head"><span class="kicker">For grown-ups</span><h1>Settings and progress</h1><p class="dim">Progress is saved in this browser on this device only.</p></div>
  <div class="form">
    <div class="field"><label for="setPlayer">Player name</label><input type="text" id="setPlayer" value="${esc(S.player)}" maxlength="20"></div>
    <div class="field"><label for="setName">Creature's name</label><input type="text" id="setName" value="${esc(S.name)}" maxlength="20"></div>
    <label class="toggle"><input type="checkbox" id="setSound" ${S.settings.sound?'checked':''}> Sound effects</label>
    <label class="toggle"><input type="checkbox" id="setSpeak" ${S.settings.speak?'checked':''}> Read questions and cheers out loud</label>
    <label class="toggle"><input type="checkbox" id="setHints" ${S.settings.hints?'checked':''}> Show the Hint button</label>
  </div>
  <div class="section-title"><h2>Exponent Tunnel progress</h2></div>
  <div class="tablewrap"><table><thead><tr><th>Game</th><th>Basic rounds</th><th>Basic first-try</th><th>Advanced rounds</th><th>Advanced first-try</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="dim" style="margin-top:12px">Coins: ${fmt(S.coins)} · Shinies: ${S.shinies.length} of ${ALL_SHINIES.length} · Wonder Cards: ${S.wonders.length} of ${GAMES.length}</p>
  <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn" id="resetBtn">Reset all progress</button><span class="dim" id="resetMsg"></span></div>`;
  resetArmed=false;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go], #homeNiff'); if (!t) return;
  if (t.id==='homeNiff') return tickle();
  if (t.dataset.go){ const g=t.dataset.go; ({home:renderHome,hoard:renderHoard,notes:renderNotes,grown:renderGrown}[g]||(()=>{}))(); return show(g); }
  if (t.dataset.topic){ renderTopic(); return show('topic'); }
  if (t.dataset.play) return startRound(t.dataset.play, t.dataset.level);
  if (t.dataset.opt!==undefined) return chooseOpt(t);
  if (t.dataset.key) return padKey(t.dataset.key);
  if (t.dataset.item) return buyItem(t.dataset.item);
  if (t.dataset.fur) return buyFur(t.dataset.fur);
  if (t.id==='hintBtn') return showHint();
  if (t.id==='nextBtn') return next();
  if (t.id==='leaveBtn' || t.id==='balLeave'){ renderTopic(); return show('topic'); }
  if (t.id==='resetBtn'){
    if (!resetArmed){ resetArmed=true; t.textContent='Tap again to erase everything'; $('#resetMsg').textContent='This cannot be undone.'; return; }
    const keep={player:S.player,name:S.name,settings:S.settings}; S=Object.assign(clone(DEFAULT),keep); save(); coinsUI(); renderGrown(); $('#resetMsg').textContent='Progress erased.';
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.target.id==='homeNiff' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); return tickle(); }
  if ($('#scr-play').hidden || !R) return;
  if (/^[0-9]$/.test(e.key)) padKey(e.key);
  else if (e.key==='.') padKey('.');
  else if (e.key==='Backspace') padKey('⌫');
  else if (e.key==='Enter'){ if (R.done) next(); else padKey('ok'); }
});
document.addEventListener('change', e => {
  const id=e.target.id;
  if (id==='setSound') S.settings.sound=e.target.checked;
  if (id==='setSpeak') S.settings.speak=e.target.checked;
  if (id==='setHints') S.settings.hints=e.target.checked;
  save();
});
document.addEventListener('input', e => {
  if (e.target.id==='setPlayer') S.player=e.target.value.trim()||'friend';
  if (e.target.id==='setName') S.name=e.target.value.trim()||'Niffler';
  save();
});

coinsUI(); renderHome(); show('home');
window.__NH = {G, GAMES};
})();
</script>
</body>
</html>
